  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    "use strict";


    /* =========================================
       API
    ========================================= */

    // 後端網址統一寫在 site-config.js
    const API_BASE =
      window.SITE.bookingApi;


    const SELF_PAY_API_BASE =
      `${API_BASE}/api/self_pay`;


    /* =========================================
       老人健檢方案
    ========================================= */

    const planMap = {

      A:
        "A方案 腦肺方案",

      B:
        "B方案 腹部方案",

      C:
        "C方案 骨密肌力方案"

    };


    /* =========================================
       狀態
    ========================================= */

    let currentPlan =
      "A";


    let appointmentData =
      {};


    let selfPayChatMode =
      "ask";

    let selfPayStep =
      "";

    let selfPaySelectedDate =
      "";

    let selfPaySelectedSession =
      "";

    let selfPayBudget =
      0;

    let selfPayRemainingBudget =
      0;

    let selfPaySelectedTotal =
      0;

    let pendingOverBudgetSelection =
      null;


    let selfPayCategories =
      [];


    let currentSelfPayCategory =
      null;


    let currentSelfPayItems =
      [];


    let currentSelfPayItem =
      null;


    let currentSelfPayBillable =
      null;


    let selfPaySelectedItems =
      [];


    let pendingDeleteSelfPayIndex =
      null;


    let selfPayMediaRecorder =
      null;


    let selfPayAudioChunks =
      [];


    let selfPayStream =
      null;


    let selfPayRecording =
      false;

    // 長者自費健檢 STT：優先用瀏覽器內建的繁體中文辨識，
    // 當瀏覽器無法辨識時，允許使用者主動切換至 Groq 備援。
    let selfPayNativeRecognition = null;
    let selfPaySTTMode = "";
    let selfPaySTTBusy = false;
    let selfPaySTTTimer = null;


    /* =========================================
       頁面初始化
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        /* =====================================
           1. 取得網址參數
        ===================================== */

        const params =
          new URLSearchParams(
            window.location.search
          );


        currentPlan =
          params.get("p") ||
          params.get("plan") ||
          "A";


        const directSelfPayBasicData =
          JSON.parse(
            sessionStorage.getItem(
              "directSelfPayBasicData"
            ) || "{}"
          );


        const name =
          params.get("name") ||
          directSelfPayBasicData.name ||
          "";


        const pid =
          params.get("pid") ||
          directSelfPayBasicData.pid ||
          "";


        const phone =
          params.get("phone") ||
          directSelfPayBasicData.phone ||
          "";


        const birthday =
          params.get("birthday") ||
          directSelfPayBasicData.birthday ||
          "";


        const rawDate =
          params.get("date") ||
          "";


        const rawTime =
          params.get("time") ||
          "";


        /* =====================================
           2. 日期格式統一

           支援：
           2026-05-01
           2026/05/01
           5/1
           5月1日
           5月1號
        ===================================== */

        function normalizeBookingDate(value) {

          const text =
            String(value || "").trim();

          if (!text) {
            return "";
          }


          /* YYYY-MM-DD / YYYY/MM/DD */

          let match =
            text.match(
              /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
            );

          if (match) {

            const year =
              match[1];

            const month =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[3])
              ).padStart(
                2,
                "0"
              );

            return (
              `${year}-${month}-${day}`
            );

          }


          /* M/D */

          match =
            text.match(
              /^(\d{1,2})\/(\d{1,2})$/
            );

          if (match) {

            const month =
              String(
                Number(match[1])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            return (
              `2026-${month}-${day}`
            );

          }


          /* M月D日 / M月D號 */

          match =
            text
              .replace(
                /\s+/g,
                ""
              )
              .match(
                /^(\d{1,2})月(\d{1,2})(?:日|號)?$/
              );

          if (match) {

            const month =
              String(
                Number(match[1])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            return (
              `2026-${month}-${day}`
            );

          }


          return "";

        }


        function normalizeBookingTime(value) {

          const text =
            String(value || "")
              .trim()
              .replace(
                /\s+/g,
                ""
              );

          if (!text) {
            return "";
          }


          /* HH:MM / H:MM */

          let match =
            text.match(
              /^(\d{1,2}):(\d{2})$/
            );

          if (match) {

            const hour =
              Number(match[1]);

            const minute =
              Number(match[2]);


            if (
              hour >= 0 &&
              hour <= 23 &&
              minute >= 0 &&
              minute <= 59
            ) {

              return (
                `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`
              );

            }

          }


          /* 上午 / 下午 + H點 */

          match =
            text.match(
              /^(上午|下午)?(\d{1,2})點(?:(\d{1,2})分|半)?$/
            );

          if (match) {

            let hour =
              Number(match[2]);

            const minute =
              text.endsWith("半")
                ? 30
                : Number(
                    match[3] || 0
                  );


            if (
              match[1] === "下午" &&
              hour < 12
            ) {
              hour += 12;
            }


            if (
              match[1] === "上午" &&
              hour === 12
            ) {
              hour = 0;
            }


            if (
              hour >= 0 &&
              hour <= 23 &&
              minute >= 0 &&
              minute <= 59
            ) {

              return (
                `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`
              );

            }

          }


          return "";

        }


        const date =
          normalizeBookingDate(
            rawDate
          );


        const time =
          normalizeBookingTime(
            rawTime
          );


        /* =====================================
           3. 顯示方案名稱
        ===================================== */

        const planDisplay =
          document.getElementById(
            "plan_display"
          );


        if (planDisplay) {

          if (
            currentPlan === "SELF_PAY"
          ) {

            planDisplay.textContent =
              "自費健康檢查";

          } else {

            planDisplay.textContent =
              `您已選擇：${
                planMap[currentPlan] ||
                planMap.A
              }`;

          }

        }


        /* =====================================
           4. 找到表單欄位
        ===================================== */

        const nameInput =
          document.querySelector(
            'input[name="name"]'
          );


        const birthdayInput =
          document.querySelector(
            'input[name="birthday"]'
          );


        const pidInput =
          document.querySelector(
            'input[name="pid"]'
          );


        const phoneInput =
          document.querySelector(
            'input[name="phone"]'
          );


        const dateSelect =
          document.querySelector(
            'select[name="book_date"]'
          );


        const timeSelect =
          document.querySelector(
            'select[name="book_time"]'
          );


        /* =====================================
           5. 自動帶入基本資料
        ===================================== */

        if (
          nameInput &&
          name
        ) {

          nameInput.value =
            name;

        }


        if (
          birthdayInput &&
          birthday
        ) {

          birthdayInput.value =
            birthday;

        }


        if (
          pidInput &&
          pid
        ) {

          pidInput.value =
            pid.toUpperCase();

        }


        if (
          phoneInput &&
          phone
        ) {

          phoneInput.value =
            phone;

        }


        /* =====================================
           6. 自動帶入預約日期
        ===================================== */

        if (
          dateSelect &&
          date
        ) {

          const dateExists =
            Array
              .from(
                dateSelect.options
              )
              .some(
                function (option) {

                  return (
                    option.value ===
                    date
                  );

                }
              );


          if (!dateExists) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              date;

            option.textContent =
              date;

            dateSelect.appendChild(
              option
            );

          }


          dateSelect.value =
            date;


          dateSelect.dispatchEvent(
            new Event(
              "change",
              {
                bubbles: true
              }
            )
          );

        }


        /* =====================================
           7. 自動帶入預約時間
        ===================================== */

        if (
          timeSelect &&
          time
        ) {

          const timeExists =
            Array
              .from(
                timeSelect.options
              )
              .some(
                function (option) {

                  return (
                    option.value ===
                    time
                  );

                }
              );


          if (!timeExists) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              time;

            option.textContent =
              time;

            timeSelect.appendChild(
              option
            );

          }


          timeSelect.value =
            time;


          timeSelect.dispatchEvent(
            new Event(
              "change",
              {
                bubbles: true
              }
            )
          );

        }


        /* =====================================
           8. Debug
        ===================================== */

        console.log(
          "✅ 預約資料已帶入：",
          {

            plan:
              currentPlan,

            name:
              name,

            birthday:
              birthday,

            pid:
              pid,

            phone:
              phone,

            rawDate:
              rawDate,

            date:
              date,

            rawTime:
              rawTime,

            time:
              time,

            dateSelected:
              dateSelect
                ? dateSelect.value
                : "",

            timeSelected:
              timeSelect
                ? timeSelect.value
                : ""

          }
        );


        /* =====================================
           9. 基本資料確認
        ===================================== */

        const form =
          document.getElementById(
            "bookingForm"
          );


        if (form) {

          form.addEventListener(
            "submit",
            function (event) {

              event.preventDefault();


              /* 檢查基本欄位 */

              if (
                !form.checkValidity()
              ) {

                form.reportValidity();

                return;

              }


              /* 檢查驗證碼 */

              if (
                !validateCaptcha()
              ) {

                return;

              }


              /* 收集基本資料 */

              collectAppointmentData();


              /* 進入 AI 自費聊天室 */

              openSelfPayChat();

            }
          );

        }


        /* =====================================
           10. 關閉聊天室
        ===================================== */

        const closeButton =
          document.getElementById(
            "selfpay-close-btn"
          );


        if (closeButton) {

          closeButton.addEventListener(
            "click",
            closeSelfPayChat
          );

        }


        /* =====================================
           11. 自費聊天室文字傳送
        ===================================== */

        const sendButton =
          document.getElementById(
            "selfpay-send-btn"
          );


        if (sendButton) {

          sendButton.addEventListener(
            "click",
            sendSelfPayText
          );

        }


        const selfPayInput =
          document.getElementById(
            "selfpay-chat-input"
          );


        if (selfPayInput) {

          selfPayInput.addEventListener(
            "keydown",
            function (event) {

              if (
                event.key ===
                "Enter"
              ) {

                event.preventDefault();

                sendSelfPayText();

              }

            }
          );

        }


        /* =====================================
           12. 自費聊天室麥克風
        ===================================== */

        const micButton =
          document.getElementById(
            "selfpay-mic-btn"
          );


        if (micButton) {

    /* =========================================
       AI 語音播報
    ========================================= */

    // 保留 utterance 參照，避免某些 Safari 版本提早回收而中止朗讀。
    let selfPayActiveUtterance = null;

    function speakSelfPayText(text, context = null) {
      const content = String(text || "").trim();
      if (window.YidianSpeech) {
        window.YidianSpeech.remember(content, context);
        if (window.YidianSpeech.getLanguage() === "nan") {
          return window.YidianSpeech.speakTaiwanese(content, context);
        }
      }

      if (!content || !("speechSynthesis" in window) ||
          !("SpeechSynthesisUtterance" in window)) {
        console.warn("此瀏覽器無法使用語音朗讀，請閱讀畫面上的文字說明。");
        return false;
      }

      try {
        const synth = window.speechSynthesis;
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(content);
        utterance.lang = "zh-TW";
        utterance.rate = window.YidianSpeech ? window.YidianSpeech.getRate() : 0.88;  // 略放慢，適合長者聆聽
        utterance.pitch = 1;

        // 優先使用繁體中文／臺灣中文語音；無合適語音則交由瀏覽器選擇。
        const voices = synth.getVoices();
        const taiwanVoice = voices.find(v =>
          /^zh[-_](TW|Hant)/i.test(v.lang) || /Taiwan/i.test(v.name)
        );
        if (taiwanVoice) utterance.voice = taiwanVoice;

        utterance.onerror = function (event) {
          if (event.error !== "interrupted" && event.error !== "canceled") {
            console.warn("自費說明語音播放失敗：", event.error);
          }
        };
        selfPayActiveUtterance = utterance;

        // 同步觸發，讓長者點選「再聽一次」時能保留 Safari 的使用者互動授權。
        synth.resume();
        synth.speak(utterance);
        return true;
      } catch (error) {
        console.error("無法朗讀自費檢查說明：", error);
        return false;
      }
    }

    /* =========================================
       取得單一自費項目資料與正確價格
       POST /api/self_pay/select

       價格以 billable.price 為準
    ========================================= */

    async function loadSelfPayItemDetail(
      itemId,
      explanationOnly = false
    ) {

      setSelfPayStatus(
        true,
        "正在取得檢查內容與價格..."
      );


      clearSelfPayOptions();


      try {

        const response =
          await fetch(

            `${SELF_PAY_API_BASE}/select`,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  item_id:
                    itemId

                })

            }

          );


        const result =
          await response.json();


        console.log(
          "自費項目 API 回傳：",
          result
        );


        if (!response.ok) {

          throw new Error(
            result.detail ||
            result.message ||
            `HTTP ${response.status}`
          );

        }


        currentSelfPayItem =
          result.item ||
          {};


        currentSelfPayBillable =
          result.billable ||
          {};


        const itemName =
          currentSelfPayBillable.name ||
          currentSelfPayItem.name ||
          "自費檢查";


        // 長者說明採用固定且可由診所審核的內容。
        const explanation = String(result.plain_explanation || currentSelfPayItem.plain_explanation || "").trim();
        const packageExplanation = String(result.package_explanation || "").trim();
        const isPackage = currentSelfPayBillable.type === "package";
        const description = explanation || "這項檢查的白話說明尚待診所確認，請向醫護人員了解用途。";
        const descriptionHtml =
          `<strong>這項檢查在做什麼？</strong><br>${escapeHtml(description)}` +
          (isPackage && packageExplanation
            ? `<br><br><strong>整套檢查在做什麼？</strong><br>${escapeHtml(packageExplanation)}`
            : "");

        const spokenExplanation =
          `${itemName}。這項檢查在做什麼？${description}` +
          (isPackage && packageExplanation
            ? `。整套檢查在做什麼？${packageExplanation}`
            : "");

        const rawPrice =
          currentSelfPayBillable.price;


        let price =
          null;


        if (
          rawPrice !== null &&
          rawPrice !== undefined &&
          rawPrice !== ""
        ) {

          const converted =
            Number(
              rawPrice
            );


          if (
            Number.isFinite(
              converted
            )
          ) {

            price =
              converted;

          }

        }


        const priceText =
          price === null

            ? "價格需向診所確認"

            : `NT$${price.toLocaleString(
                "zh-TW"
              )}`;


        const includedItems =
          Array.isArray(
            currentSelfPayBillable
              .included_items
          )

            ? currentSelfPayBillable
                .included_items

            : [];


        let includedHtml =
          "";


        if (
          includedItems.length >
          0
        ) {

          includedHtml =
            `
              <div class="sp-included">

                <strong>
                  套組包含：
                </strong>

                <br>

                ${includedItems
                  .map(
                    function (included) {

                      return (
                        `• ${escapeHtml(
                          included
                        )}`
                      );

                    }
                  )
                  .join("<br>")}

              </div>
            `;

        }


        const detailMessage = addSelfPayAIMessage(

          `
            <div class="selfpay-item-card">

              <div class="selfpay-item-name">
                ${escapeHtml(
                  itemName
                )}
              </div>

              <div class="selfpay-item-price">
                ${escapeHtml(
                  priceText
                )}
              </div>

              <div class="selfpay-item-description">
                ${descriptionHtml}
              </div>

              ${includedHtml}

              ${explanationOnly
                ? `<button type="button" class="selfpay-explanation-replay">🔊 再聽一次檢查說明</button>`
                : ""}

            </div>
          `,
          false // 此說明下方會帶 itemId／套組上下文呼叫 TTS，避免重複朗讀
        );


        // 「這是什麼？」：保留後端提供的完整醫療說明，供國語／台語走相同語意內容。
        // 台語需要對應的台語譯稿（台羅）及後端合成，不能把國語漢字直接當成台語唸。
        // 本段僅朗讀說明，不會修改任何自費加購、價格或預算資料。
        if (explanationOnly) {
          const speechContext = {
            kind: "exam_explanation",
            itemId: String(itemId),
            itemName: itemName,
            plainExplanationZh: description,
            packageExplanationZh: isPackage ? packageExplanation : ""
          };
          if (detailMessage) {
            // 「朗讀目前對話」也要找到完整說明，而不是下方附加的醫療提醒。
            detailMessage.dataset.yidianSpeechText = spokenExplanation;
            detailMessage._yidianSpeechContext = speechContext;
          }
          const replayButton = detailMessage?.querySelector(".selfpay-explanation-replay");
          if (replayButton) {
            replayButton.addEventListener("click", function () {
              speakSelfPayText(spokenExplanation, speechContext);
            });
          }
          speakSelfPayText(spokenExplanation, speechContext);
          const noteMessage = addSelfPayAIMessage(
            "以上是診所提供的項目用途與內容說明；檢驗指標不等於疾病確診，" +
            "實際是否適合及結果判讀，請由醫師依個人狀況評估。<br><br>" +
            "如需選購，請另外按右側選單的「＋加入」。",

        /* =========================================
       建立可加入清單的 billable unit

       如果使用者點的是套組中的細項，
       只要後端回傳相同 billable key，
       就只加入一次、不重複計價。
    ========================================= */

    function buildCurrentSelfPaySelection() {

      if (
        !currentSelfPayItem ||
        !currentSelfPayBillable
      ) {

        return null;

      }


      const itemId =
        currentSelfPayItem.id ??
        currentSelfPayItem.item_id ??
        currentSelfPayItem.key ??
        "";


      const billableId =
        currentSelfPayBillable.id ??
        currentSelfPayBillable.billable_id ??
        currentSelfPayBillable.key ??
        itemId;


      const name =
        currentSelfPayBillable.name ||
        currentSelfPayItem.name ||
        "自費檢查";


      const rawPrice =
        currentSelfPayBillable.price;


      let price =
        null;


      if (
        rawPrice !== null &&
        rawPrice !== undefined &&
        rawPrice !== ""
      ) {

        const converted =
          Number(
            rawPrice
          );


        if (
          Number.isFinite(
            converted
          )
        ) {

          price =
            converted;

        }

      }


      const includedItems =
        Array.isArray(
          currentSelfPayBillable
            .included_items
        )
          ? currentSelfPayBillable
              .included_items
          : [];


      return {

        key:
          String(
            billableId
          ),

        itemId:
          String(
            itemId
          ),

        name:
          String(
            name
          ),

        price:
          price,

        type:
          currentSelfPayBillable.type ||
          (
            includedItems.length
              ? "package"
              : "single"
          ),

        includedItems:
          includedItems

      };

    }


    /* =========================================
       是否已加入同一個 billable unit
    ========================================= */

    function isSelfPayItemSelected(
      selection
    ) {

      if (!selection) {

        return false;

      }


      return selfPaySelectedItems.some(
        function (selected) {

          return (
            String(selected.key || "") === String(selection.key || "") ||
            (String(selected.itemId || "") === String(selection.itemId || "") &&
             String(selected.itemId || "") !== "")
          );

        }
      );

    }


    /* =========================================
       計算目前自費總額
    ========================================= */

    function calculateSelfPayTotal() {

      return selfPaySelectedItems.reduce(
        function (
          total,
          item
        ) {

          const price =
            Number(
              item.price
            );


          if (
            !Number.isFinite(
              price
            )
          ) {

            return total;

          }


          return (
            total +
            price
          );

        },
        0
      );

    }


    /* =========================================
       加入自費項目

       注意：
       預算是「參考預算」，
       超過時不是禁止加入，
       而是要求使用者二次確認。
    ========================================= */

    function addCurrentSelfPayItem() {

      const selection =
        buildCurrentSelfPaySelection();


      if (!selection) {

        return {

          success:
            false,

          reason:
            "missing"

        };

      }


      if (
        isSelfPayItemSelected(
          selection
        )
      ) {

        return {

          success:
            false,

          reason:
            "duplicate",

          item:
            selection

        };

      }


      const currentTotal =
        calculateSelfPayTotal();


      const newItemPrice =
        Number(
          selection.price || 0
        );


      const newTotal =
        currentTotal +
        newItemPrice;


      /* -----------------------------------------
         超過參考預算
      ----------------------------------------- */

      if (
        selfPayBudget > 0 &&
        newTotal > selfPayBudget
      ) {

        const overAmount =
          newTotal -
          selfPayBudget;


        return {

          success:
            false,

          reason:
            "budget_confirmation_required",

          selection:
            selection,

          currentTotal:
            currentTotal,

          newTotal:
            newTotal,

          overAmount:
            overAmount

        };

      }


      /* -----------------------------------------
         沒有超過預算，直接加入
      ----------------------------------------- */

      selfPaySelectedItems.push(
        selection
      );


      selfPaySelectedTotal =
        calculateSelfPayTotal();


      selfPayRemainingBudget =
        selfPayBudget -
        selfPaySelectedTotal;


      return {

        success:
          true,

        item:
          selection

      };

    }

    function findCategoryIdByText(
      text
    ) {

      const normalized =
        String(
          text ||
          ""
        )
          .trim()
          .toLowerCase();


      if (!normalized) {

        return null;

      }


      const matched =
        selfPayCategories.find(
          function (category) {

            const id =
              String(
                category.id ||
                ""
              );


            const name =
              String(
                category.name ||
                ""
              )
                .toLowerCase();


            if (
              name &&
              normalized.includes(
                name
              )
            ) {

              return true;

            }


            if (
              id ===
              "cardiovascular"
            ) {

              return (
                normalized.includes(
                  "心"
                ) ||
                normalized.includes(
                  "血管"
                )
              );

            }


            if (
              id ===
              "pulmonary"
            ) {

              return (
                normalized.includes(
                  "肺"
                )
              );

            }


            if (
              id ===
              "hepatobiliary_gastrointestinal"
            ) {

              return (

                normalized.includes(
                  "肝"
                ) ||

                normalized.includes(
                  "膽"
                ) ||

                normalized.includes(
                  "胃"
                ) ||

                normalized.includes(
                  "腸"
                )

              );

            }


            if (
              id ===
              "renal_urology"
            ) {

              return (

                normalized.includes(
                  "腎"
                ) ||

                normalized.includes(
                  "泌尿"
                )

              );

            }


            if (
              id ===
              "other_value_added"
            ) {

              return (

                normalized.includes(
                  "其他"
                ) ||

                normalized.includes(
                  "加值"
                )

              );

            }


            return false;

          }
        );


      return matched
        ? matched.id
        : null;

    }

    /* =========================================
       自費健檢：某一天開哪些診、為什麼不能預約
       門診時段、休診日、每日名額都在後台「診所設定」設定（clinic.js）
    ========================================= */

    const WEEK_NAMES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    function isSameDay(a, b) {
      return ClinicSchedule.ymd(a) === ClinicSchedule.ymd(b);
    }

    function selfPaySessionsAvailable(date) {
      let sessions = ClinicSchedule.selfPaySessionsOn(date);
      const now = new Date();
      if (isSameDay(date, now)) {
        // 當天上午診無法預約；10:30 後下午診也停止受理
        sessions = sessions.filter(s => s === "afternoon");
        if (now.getHours() * 60 + now.getMinutes() >= 10 * 60 + 30) sessions = [];
      }
      return sessions;
    }

    function selfPayDateBlockedReason(date) {
      const d = new Date(date); d.setHours(0, 0, 0, 0);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      if (d < today) return "這一天已經過了。";
      if (ClinicSchedule.isClosed(d)) return "這一天診所休診。";
      if (!ClinicSchedule.selfPaySessionsOn(d).length) return `${WEEK_NAMES[d.getDay()]}診所沒有提供自費健檢。`;
      if (ClinicSchedule.isFull(d, "selfPay")) return "這一天的自費健檢名額已經額滿。";
      if (!selfPaySessionsAvailable(d).length) return "今天的預約受理時間已過（當日上午無法預約，10:30 後下午診也停止受理）。";
      return "";
    }

    function showSelfPaySessionOptions(date, prefix) {
      const sessions = selfPaySessionsAvailable(date);
      const isToday = isSameDay(date, new Date());
      const allDay = ClinicSchedule.selfPaySessionsOn(date);
      let note = "";
      if (isToday) note = "📌 當天上午診無法預約，目前可預約下午診。<br><br>";
      else if (allDay.length === 1) note = `📌 ${WEEK_NAMES[new Date(date).getDay()]}只有${allDay[0] === "morning" ? "上午診" : "下午診"}。<br><br>`;
      addSelfPayAIMessage(prefix + note + "👉 請選擇預約時段：", false);
      showSelfPayOptions(
        sessions.map(s => ({ label: ClinicSchedule.sessionLabel(s), value: s }))
          .concat([{ label: "重新選擇日期", value: "change-date" }])
      );
    }

      wrapper.appendChild(

      );

      );


      // 圖例
      const legend = document.createElement("div");
      legend.className = "sp-cal-legend";
      legend.innerHTML =
        '<span><i class="ok"></i>可預約</span>' +
        '<span><i class="off"></i>休診／已過</span>' +
        '<span><i class="full"></i>額滿</span>';
      wrapper.appendChild(legend);

      const fp = flatpickr(
        input,
        {

          locale:
            "zh_tw",

          dateFormat:
            "Y-m-d",

          minDate:
            "today",

          inline:
            true,

          /* 不能選的日子：不開診、休診日、額滿、今天已過受理時間 */
          disable: [
            function (date) {
              return !!selfPayDateBlockedReason(date);
            }
          ],

          /* 在日曆格子上標示「額滿」「休診」 */
          onDayCreate:
            function (dObj, dStr, fpInstance, dayElem) {
              const date = dayElem.dateObj;
              if (!date || dayElem.classList.contains("prevMonthDay") || dayElem.classList.contains("nextMonthDay")) return;
              const today = new Date(); today.setHours(0, 0, 0, 0);
              if (date < today) return;
              let tag = "";
              if (ClinicSchedule.isClosed(date)) tag = "休診";
              else if (ClinicSchedule.selfPaySessionsOn(date).length && ClinicSchedule.isFull(date, "selfPay")) tag = "額滿";
              if (tag) {
                dayElem.classList.add(tag === "額滿" ? "sp-day-full" : "sp-day-closed");
                dayElem.title = tag;
                const t = document.createElement("small");
                t.textContent = tag;
                dayElem.appendChild(t);
              }
            },


          /* =====================================
             使用者選擇日期
          ===================================== */

          onChange:
            function (selectedDates) {

              if (!selectedDates.length) {
                return;
              }

              const selectedDate = selectedDates[0];
              const month = selectedDate.getMonth() + 1;
              const day = selectedDate.getDate();

              const confirmDate =
                window.confirm(
                  `您選擇的是 ${month}/${day}，確定要預約這一天嗎？`
                );

              if (!confirmDate) {
                input._flatpickr.clear();
                return;
              }

              const reason = selfPayDateBlockedReason(selectedDate);
              if (reason) {
                addSelfPayAIMessage(reason + "<br><br>請重新選擇其他日期。", false);
                input._flatpickr.clear();
                return;
              }

              selfPaySelectedDate =
                ClinicSchedule.ymd(selectedDate);

              addSelfPayUserMessage(
                `${month}/${day}`
              );

              clearSelfPayOptions();

              selfPayStep =
                "session";

              showSelfPaySessionOptions(
                selectedDate,
                `好的，已選擇 ${month}/${day}。<br><br>`
              );

            }

        }

      );

      // 讀取最新的預約數量後，重畫日曆（額滿的日子變灰）
      ClinicSchedule.refreshAvailability().then(() => fp.redraw());

    }

    /* =========================================
       把口語金額轉成數字
       「三千」「三千塊」「兩千五」(=2500)「一萬五」(=15000)
       「3000元」「3,000」「1萬2」「五百」
    ========================================= */

    function parseSpokenAmount(text) {

      const DIGIT = {
        "零": 0, "〇": 0, "一": 1, "二": 2, "兩": 2, "三": 3, "四": 4,
        "五": 5, "六": 6, "七": 7, "八": 8, "九": 9
      };
      const UNIT = { "十": 10, "百": 100, "千": 1000, "仟": 1000, "佰": 100 };

      function convert(run) {
        let total = 0, section = 0, num = 0, lastUnit = 1;
        let afterZero = false, prevWasDigit = false, digitsAfterUnit = 0;

        for (const ch of run) {
          if (/[0-9]/.test(ch) || ch in DIGIT) {
            const d = /[0-9]/.test(ch) ? Number(ch) : DIGIT[ch];
            if (ch === "零" || ch === "〇") afterZero = true;
            num = prevWasDigit ? num * 10 + d : d;
            prevWasDigit = true;
            digitsAfterUnit += 1;
          } else if (ch in UNIT) {
            section += (num || 1) * UNIT[ch];
            num = 0; lastUnit = UNIT[ch]; prevWasDigit = false;
            afterZero = false; digitsAfterUnit = 0;
          } else if (ch === "萬") {
            section += num;
            total += (section || 1) * 10000;
            section = 0; num = 0; lastUnit = 10000; prevWasDigit = false;
            afterZero = false; digitsAfterUnit = 0;
          }
        }

        // 口語省略：「兩千五」= 2500、「一萬五」= 15000
        if (num && lastUnit >= 100 && !afterZero && digitsAfterUnit === 1) {
          num = num * (lastUnit / 10);
        }
        return total + section + num;
      }

      const clean = String(text || "")
        .normalize("NFKC")
        .replace(/[,，\s]/g, "");

      const runs = clean.match(/[0-9零〇一二兩三四五六七八九十百千萬仟佰億]+/g) || [];
      let best = 0;
      runs.forEach(run => {
        const v = convert(run);
        if (v > best) best = v;
      });
      return best;
    }

          `不好意思，我想再確認一次。<br><br>` +

          `請問您需要了解自費健康檢查嗎？`

        );


        showSelfPayOptions([

          {
            label:
              "需要，我想看看",

            value:
              "start"
          },

          {
            label:
              "不需要，直接安排預約",

            value:
              "skip"
          }

        ]);


        return;

      }


      /* =====================================
         共用：查看已選項目
      ===================================== */

      if (

        rawValue ===
          "view-selected" ||

        text.includes(
          "查看已選"
        ) ||

        text.includes(
          "查看清單"
        ) ||

        text.includes(
          "目前清單"
        )

      ) {

        showSelectedSelfPayItems();


        if (
          selfPayChatMode ===
          "afterAdd"
        ) {

          showAfterAddOptions();

        }

        else if (
          selfPayChatMode ===
          "item"
        ) {

          showSelfPayItemButtons();

        }

        else {

          showSelfPayCategoryButtons();

        }


        return;

      }


      /* =====================================
         共用：完成自費選擇
      ===================================== */

      if (
        rawValue ===
        "finish"
      ) {

        confirmSelfPaySelection();


        return;

      }


      /* =====================================
         共用：回分類
      ===================================== */

      if (

        rawValue ===
          "back-category" ||

        text.includes(
          "回到五大分類"
        ) ||

        text.includes(
          "回分類"
        )

      ) {

        selfPayChatMode =
          "category";


        addSelfPayAIMessage(
          "好的，請重新選擇您想了解的自費檢查分類。"
        );


        showSelfPayCategoryButtons();


        return;

      }


      /* =====================================
         STEP 2
         選分類
      ===================================== */

      if (
        selfPayChatMode ===
        "category"
      ) {

        let categoryId =
          null;


        if (
          rawValue.startsWith(
            "category:"
          )
        ) {

          categoryId =
            rawValue.substring(
              9
            );

        }

        else {

          categoryId =
            findCategoryIdByText(
              rawValue
            );

        }


        if (!categoryId) {

          addSelfPayAIMessage(

            `我還沒有辨識到您想看的分類。<br><br>` +

            `您可以直接點選下方分類。`

          );


          showSelfPayCategoryButtons();


          return;

        }


        await loadSelfPayCategoryItems(
          categoryId
        );


        return;

      }


      /* =====================================
         STEP 3
         選檢查項目
      ===================================== */

      if (
        selfPayChatMode ===
        "item"
      ) {

        if (
          rawValue ===
          "back-items"
        ) {

          showSelfPayItemButtons();


          return;

        }


        let itemId =
          null;


        if (
          rawValue.startsWith(
            "item:"
          )
        ) {

          itemId =
            rawValue.substring(
              5
            );

        }

        else {

          itemId =
            findItemIdByText(
              rawValue
            );

        }


        if (!itemId) {

          addSelfPayAIMessage(

            `我還沒有找到您說的檢查項目。<br><br>` +

            `請直接點選下面的項目，` +

            `或完整說出檢查名稱。`

          );


          showSelfPayItemButtons();


          return;

        }


        await loadSelfPayItemDetail(
          itemId
        );


        return;

      }


      /* =====================================
         STEP 4
         是否加入目前項目
      ===================================== */

      if (
        selfPayChatMode ===
        "confirmItem"
      ) {

        /* 回目前分類的項目列表 */

        if (
          rawValue ===
          "back-items"
        ) {

          selfPayChatMode =
            "item";


          addSelfPayAIMessage(
            "好的，請繼續選擇其他檢查項目。"
          );


          showSelfPayItemButtons();


          return;

        }


        /* 先不要 */

        const wantsCancel =

          rawValue ===
            "cancel-item" ||

          text.includes(
            "先不要"
          ) ||

          text.includes(
            "不用"
          ) ||

          text.includes(
            "不要"
          );


        if (wantsCancel) {

          selfPayChatMode =
            "item";


          addSelfPayAIMessage(
            "好的，這個項目先不加入。"
          );


          showSelfPayItemButtons();


          return;

        }


        /* 加入 */

        const wantsAdd =

          rawValue ===
            "add" ||

          rawValue ===
            "confirm-add" ||

          text.includes(
            "加入這個項目"
          ) ||

          text.includes(
            "加入"
          ) ||

          text.includes(
            "加購"
          );


        if (wantsAdd) {

          const result =
            addCurrentSelfPayItem();


          /* -------------------------------
             已經加入過
          -------------------------------- */

          if (
            result.reason ===
            "duplicate"
          ) {

            addSelfPayAIMessage(

              `這個項目或所屬套餐已經加入過了，` +

              `不會重複計價。`

            );


            showAfterAddOptions();


            return;

          }


          /* -------------------------------
             超過參考預算
          -------------------------------- */

          if (
            result.reason ===
            "budget_confirmation_required"
          ) {

            pendingOverBudgetSelection =
              result.selection;


            addSelfPayAIMessage(

              `⚠️ 加入這個項目後會超過您原先設定的參考預算。<br><br>` +

              `原定預算：` +

              `<strong>NT$${selfPayBudget.toLocaleString(
                "zh-TW"
              )}</strong><br>` +

              `加入後合計：` +

              `<strong>NT$${result.newTotal.toLocaleString(
                "zh-TW"
              )}</strong><br>` +

              `將超出：` +

`<strong class="text-over-budget">NT$${result.overAmount.toLocaleString(
  "zh-TW"
)}</strong><br><br>` +

              `預算僅供規劃參考，` +

              `您仍可以繼續加購。<br><br>` +

              `請問確定要加入這個項目嗎？`,

              false

            );


            selfPayChatMode =
              "confirmOverBudget";


            showSelfPayOptions([

              {
                label:
                  "仍要加購",

                value:
                  "confirm-over-budget"
              },

              {
                label:
                  "先不要",

                value:
                  "cancel-over-budget"
              }

            ]);


            return;

          }


          /* -------------------------------
             其他加入失敗
          -------------------------------- */

          if (
            !result.success
          ) {

            addSelfPayAIMessage(
              "目前無法加入這個項目，請重新選擇。"
            );


            selfPayChatMode =
              "item";


            showSelfPayItemButtons();


            return;

          }


          /* -------------------------------
             正常加入成功
          -------------------------------- */

          selfPaySelectedTotal =
            calculateSelfPayTotal();


          selfPayRemainingBudget =
            selfPayBudget -
            selfPaySelectedTotal;


          const price =
            Number(
              result.item.price
            );


          const priceText =
            Number.isFinite(
              price
            )

              ? `NT$${price.toLocaleString(
                  "zh-TW"
                )}`

              : "價格需確認";


          let budgetStatusText =
            "";


          if (
            selfPayBudget > 0
          ) {

            if (
              selfPayRemainingBudget >=
              0
            ) {

              budgetStatusText =

                `<br>` +

                `預算尚餘：` +

                `<strong>NT$${selfPayRemainingBudget.toLocaleString(
                  "zh-TW"
                )}</strong>`;

            }

            else {

              budgetStatusText =

                `<br>` +

                `目前超出參考預算：` +

`<strong class="text-over-budget">NT$${Math.abs(
  selfPayRemainingBudget
).toLocaleString(
  "zh-TW"
)}</strong>`;

            }

          }


          addSelfPayAIMessage(

            `✅ 已加入「${escapeHtml(
              result.item.name
            )}」。<br><br>` +

            `本項價格：<strong>${escapeHtml(
              priceText
            )}</strong><br>` +

            `目前共選擇 ` +

            `<strong>${selfPaySelectedItems.length}</strong>` +

            ` 項。<br>` +

            `原定預算：` +

            `<strong>NT$${selfPayBudget.toLocaleString(
              "zh-TW"
            )}</strong><br>` +

            `目前合計：` +

            `<strong>NT$${selfPaySelectedTotal.toLocaleString(
              "zh-TW"
            )}</strong>` +

            `${budgetStatusText}`,

            true

          );


          showAfterAddOptions();


          return;

        }


        /* 無法辨識 */

        addSelfPayAIMessage(
          "請問要將這個自費檢查加入清單嗎？"
        );


        showSelfPayOptions([

          {
            label:
              "加入這個項目",

            value:
              "add"
          },

          {
            label:
              "先不要",

            value:
              "cancel-item"
          },

          {
            label:
              "回到這個分類",

            value:
              "back-items"
          }

        ]);


        return;

      }


      /* =====================================
         STEP 5
         加入後
      ===================================== */

      if (
        selfPayChatMode ===
        "afterAdd"
      ) {

        /* 繼續選 */

        if (

          rawValue ===
            "continue" ||

          text.includes(
            "繼續選"
          ) ||

          text.includes(
            "其他項目"
          ) ||

          text.includes(
            "再選"
          )

        ) {

          selfPayChatMode =
            "category";


          addSelfPayAIMessage(
            "好的，請選擇下一個想了解的自費檢查分類。"
          );


          showSelfPayCategoryButtons();


          return;

        }


        /* 完成 */

        if (

          rawValue ===
            "finish" ||

          text.includes(
            "完成"
          ) ||

          text.includes(
            "選好了"
          )

        ) {

          confirmSelfPaySelection();


          return;

        }


        showAfterAddOptions();


        return;

      }


      /* =====================================
         無法辨識
      ===================================== */

      addSelfPayAIMessage(

        `我沒有辨識到這個操作，` +

        `請使用下方按鈕繼續。`

      );


      if (
        selfPayChatMode ===
        "category"
      ) {

        showSelfPayCategoryButtons();

      }

      else if (
        selfPayChatMode ===
        "item"
      ) {

        showSelfPayItemButtons();

      }

      else if (
        selfPayChatMode ===
        "afterAdd"
      ) {

        showAfterAddOptions();

      }

    }

    /* =========================================
       自費健檢：中文語音辨識 (STT)

       1. 先使用瀏覽器 SpeechRecognition / webkitSpeechRecognition
          不依賴 GROQ_API_KEY。
       2. 遇到瀏覽器服務錯誤，可由使用者自行點擊
          「改用備援錄音辨識」（8000 的 Groq Whisper）。
       3. 若 Groq 金鑰尚未設定，清楚說明，而非顯示模糊錯誤。
    ========================================= */

    function setSelfPayMicActive(active) {
      selfPayRecording = Boolean(active);
      const button = document.getElementById("selfpay-mic-btn");
      if (!button) return;
      button.classList.toggle("recording", selfPayRecording);
      button.setAttribute("aria-pressed", selfPayRecording ? "true" : "false");
      button.setAttribute("aria-label", selfPayRecording
        ? "停止錄音並辨識語音" : "語音輸入：開始說話");
      button.title = selfPayRecording
        ? "再按一次結束錄音" : "按一下開始說話，再按一下結束";
      button.textContent = selfPayRecording ? "⏹" : "🎤";
    }

    function clearSelfPaySTTTimer() {
      if (selfPaySTTTimer !== null) {
        clearTimeout(selfPaySTTTimer);
        selfPaySTTTimer = null;
      }
    }

    function showSelfPaySTTError(code, extra = "") {
      setSelfPayStatus(false);
      const messages = {
        "not-allowed": "麥克風或語音辨識權限被拒絕。請到瀏覽器網站設定允許麥克風，並確認 Mac『隱私權與安全性 → 麥克風』已允許此瀏覽器。",
        "service-not-allowed": "瀏覽器不允許使用語音辨識服務。請檢查瀏覽器的語音辨識權限，或嘗試 Chrome。",
        "audio-capture": "目前找不到可用的麥克風。請確認麥克風已連接，並檢查 macOS 的麥克風權限。",
        "no-speech": "剛剛沒有聽到清楚的聲音。請靠近麥克風，再按一次 🎤 試試看。",
        "network": "瀏覽器語音辨識服務無法連線。請確認網路連線，或嘗試 Chrome。",
        "language-not-supported": "這個瀏覽器的語音服務目前不支援臺灣中文辨識。",
        "aborted": "這次語音輸入已取消。您可以重新按 🎤 開始。",
        "unsupported": "此瀏覽器沒有提供語音辨識服務，可以使用下方的備援錄音辨識。",
        "server-unconfigured": "8000 預約後端尚未設定 GROQ_API_KEY，因此備援 Whisper 辨識無法使用。請先使用支援語音辨識的 Chrome，或由管理員設定後端金鑰。",
        "server-unreachable": "無法連接 8000 預約後端。請確認 website/main.py 已啟動於 127.0.0.1:8000。"
      };
      const message = messages[code] || (extra || "語音辨識未成功，請重試或先使用文字輸入。");
      console.warn("自費健檢 STT：", code, extra);
      const canFallback = ["unsupported", "network", "service-not-allowed", "language-not-supported"].includes(code);
      const wrapper = addSelfPayAIMessage(
        `⚠️ ${escapeHtml(message)}<br><br>您也可以先使用下方文字輸入。` +
        (canFallback ? `<br><br><button type="button" class="selfpay-option-btn selfpay-stt-server-retry" style="font-size:20px;min-height:52px">🎙️ 改用備援錄音辨識</button>` : ""),
        false
      );
      const fallbackButton = wrapper && wrapper.querySelector(".selfpay-stt-server-retry");
      if (fallbackButton) {
        fallbackButton.addEventListener("click", function () {
          startSelfPayServerRecording();
        });
      }
    }

    async function processSelfPayRecognizedSpeech(transcript) {
      const content = String(transcript || "").trim();
      if (!content) {
        showSelfPaySTTError("no-speech");
        return;
      }
      selfPaySTTBusy = true;
      setSelfPayStatus(true, `✅ 已聽到：${content}，正在處理...`);
      try {
        await handleSelfPayAnswer(content, content);
      } catch (error) {
        console.error("語音內容處理失敗：", error);
        addSelfPayAIMessage("抱歉，剛剛聽懂了您的話，但處理時發生錯誤。請再試一次或使用文字輸入。", false);
      } finally {
        selfPaySTTBusy = false;
        setSelfPayStatus(false);
      }
    }

    function startSelfPayVoice() {
      if (selfPayRecording || selfPaySTTBusy) return;
      // 避免 AI 自己的朗讀聲被辨識成使用者的回答。
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) {
        showSelfPaySTTError("unsupported");
        return;
      }

      let recognition;
      try {
        recognition = new Recognition();
        recognition.lang = "zh-TW";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
      } catch (error) {
        console.error("無法建立語音辨識器：", error);
        showSelfPaySTTError("unsupported");
        return;
      }

      selfPayNativeRecognition = recognition;
      selfPaySTTMode = "browser";
      let received = false;
      let failure = "";
      recognition.onstart = function () {
        setSelfPayMicActive(true);
        setSelfPayStatus(true, "🎤 請說話，例如『五萬』或『我想檢查心臟』；說完可再按一次麥克風。");
      };
      recognition.onresult = async function (event) {
        if (received) return;
        received = true;
        clearSelfPaySTTTimer();
        setSelfPayMicActive(false);
        selfPayNativeRecognition = null;
        let transcript = "";
        if (event.results) {
          for (let i = event.resultIndex || 0; i < event.results.length; i++) {
            const result = event.results[i];
            if (result && result[0] && result[0].transcript) {
              transcript += " " + result[0].transcript;
            }
          }
        }
        await processSelfPayRecognizedSpeech(transcript);
      };
      recognition.onerror = function (event) {
        failure = String((event && event.error) || "unknown");
        clearSelfPaySTTTimer();
        setSelfPayMicActive(false);
        selfPayNativeRecognition = null;
        if (!received) showSelfPaySTTError(failure);
      };
      recognition.onend = function () {
        clearSelfPaySTTTimer();
        setSelfPayMicActive(false);
        if (selfPayNativeRecognition === recognition) selfPayNativeRecognition = null;
        if (!received && !failure) showSelfPaySTTError("no-speech");
      };

      // 重要：在使用者點擊事件中同步呼叫 start()，以符合 Safari 權限限制。
      try {
        recognition.start();
        setSelfPayMicActive(true);
        setSelfPayStatus(true, "🎤 正在啟動中文語音辨識，請直接說話...");
        clearSelfPaySTTTimer();
        selfPaySTTTimer = setTimeout(function () {
          if (selfPayNativeRecognition === recognition) {
            try { recognition.stop(); } catch (_) { /* 已經結束 */ }
          }
        }, 20000);
      } catch (error) {
        clearSelfPaySTTTimer();
        selfPayNativeRecognition = null;
        setSelfPayMicActive(false);
        console.error("啟動瀏覽器語音辨識失敗：", error);
        showSelfPaySTTError(error.name === "NotAllowedError" ? "not-allowed" : "unsupported");
      }
    }

    function stopSelfPayVoice() {
      if (!selfPayRecording) return;
      setSelfPayMicActive(false);
      setSelfPayStatus(true, "正在整理剛剛說的話...");
      clearSelfPaySTTTimer();
      if (selfPaySTTMode === "browser" && selfPayNativeRecognition) {
        try { selfPayNativeRecognition.stop(); }
        catch (error) { console.warn("結束語音辨識失敗：", error); }
        return;
      }
      if (selfPaySTTMode === "server" && selfPayMediaRecorder &&
          selfPayMediaRecorder.state !== "inactive") {
        selfPayMediaRecorder.stop();
      }
    }

    // 瀏覽器不支援或無法使用時，由使用者明確點擊啟動備援服務。
    // 後端既有端點 POST /api/whisper_booking，需設定 GROQ_API_KEY。
    async function startSelfPayServerRecording() {
      if (selfPayRecording || selfPaySTTBusy) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia ||
          !window.MediaRecorder) {
        showSelfPaySTTError("audio-capture");
        return;
      }
      selfPaySTTBusy = true;
      setSelfPayStatus(true, "正在確認備援語音服務...");
      try {
        const healthResponse = await fetch(`${API_BASE}/api/booking/health`, {
          cache: "no-store"
        });
        if (!healthResponse.ok) throw new Error("health-failed");
        const health = await healthResponse.json();
        if (!health.groq_loaded) {
          selfPaySTTBusy = false;
          showSelfPaySTTError("server-unconfigured");
          return;
        }
      } catch (error) {
        console.error("檢查 8000 後端語音服務失敗：", error);
        selfPaySTTBusy = false;
        showSelfPaySTTError("server-unreachable");
        return;
      }

      try {
        selfPayStream = await navigator.mediaDevices.getUserMedia({audio: true});
        selfPayAudioChunks = [];
        const candidates = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"];
        const supported = candidates.find(type => MediaRecorder.isTypeSupported(type));
        selfPayMediaRecorder = new MediaRecorder(selfPayStream, supported ? {mimeType: supported} : {});
        selfPayMediaRecorder.ondataavailable = function (event) {
          if (event.data && event.data.size > 0) selfPayAudioChunks.push(event.data);
        };
        selfPayMediaRecorder.onerror = function (event) {
          console.error("錄音錯誤：", event);
          setSelfPayStatus(false);
        };
        selfPayMediaRecorder.onstop = async function () {
          const contentType = selfPayMediaRecorder.mimeType || selfPayAudioChunks[0]?.type || "audio/webm";
          const blob = new Blob(selfPayAudioChunks, {type: contentType});
          if (selfPayStream) selfPayStream.getTracks().forEach(track => track.stop());
          selfPayStream = null;
          clearSelfPaySTTTimer();
          await sendSelfPayVoiceToWhisper(blob);
        };
        selfPayMediaRecorder.start(250);
        selfPaySTTMode = "server";
        selfPaySTTBusy = false;
        setSelfPayMicActive(true);
        setSelfPayStatus(true, "🎙️ 備援錄音中；請說話，再按一次麥克風送出。");
        clearSelfPaySTTTimer();
        selfPaySTTTimer = setTimeout(stopSelfPayVoice, 25000);
      } catch (error) {
        if (selfPayStream) selfPayStream.getTracks().forEach(track => track.stop());
        selfPayStream = null;
        selfPaySTTBusy = false;
        setSelfPayMicActive(false);
        setSelfPayStatus(false);
        console.error("啟動備援錄音失敗：", error);
        showSelfPaySTTError(error.name === "NotAllowedError" ? "not-allowed" : "audio-capture");
      }
    }

    async function sendSelfPayVoiceToWhisper(blob) {
      if (!blob || blob.size === 0) {
        selfPaySTTBusy = false;
        showSelfPaySTTError("no-speech");
        return;
      }
      selfPaySTTBusy = true;
      setSelfPayStatus(true, "正在辨識您的語音，請稍候...");
      try {
        const mime = blob.type.toLowerCase();
        const ext = mime.includes("mp4") ? "m4a"
          : mime.includes("ogg") ? "ogg"
          : mime.includes("wav") ? "wav" : "webm";
        const fd = new FormData();
        fd.append("file", blob, `selfpay.${ext}`);
        fd.append("current_name", appointmentData.name || "");
        const response = await fetch(`${API_BASE}/api/whisper_booking`, {
          method: "POST", body: fd
        });
        const result = await response.json();
        if (!response.ok || result.status === "error") {
          throw new Error(result.message || result.detail || `HTTP ${response.status}`);
        }
        const recognizedText = String(result.raw_text || result?.result?.translated_text ||
          result.translated_text || "").trim();
        selfPaySTTBusy = false;
        if (!recognizedText) {
          showSelfPaySTTError("no-speech");
          return;
        }
        await processSelfPayRecognizedSpeech(recognizedText);
      } catch (error) {
        selfPaySTTBusy = false;
        setSelfPayStatus(false);
        console.error("備援 Whisper 語音辨識失敗：", error);
        showSelfPaySTTError("server-error", `伺服器辨識失敗：${error.message || "未知錯誤"}`);
      }
    }

    /* =========================================================
       驗證碼
    ========================================================= */

    let currentCaptcha =
      "";


    let captchaVoices =
      [];


    /* ---------------------------------------------------------
       產生驗證碼
    --------------------------------------------------------- */

    function generateCaptcha() {

      const chars =
        "0123456789";


      currentCaptcha =
        "";


      for (
        let i = 0;
        i < 5;
        i++
      ) {

        const index =
          Math.floor(

            Math.random() *
            chars.length

          );


        currentCaptcha +=
          chars[index];

      }


      const canvas =
        document.getElementById(
          "captchaCanvas"
        );


      if (!canvas) {
        return;
      }


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#f5f7fa";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* 干擾線 */

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        ctx.beginPath();


        ctx.moveTo(

          Math.random() *
          canvas.width,

          Math.random() *
          canvas.height

        );


        ctx.lineTo(

          Math.random() *
          canvas.width,

          Math.random() *
          canvas.height

        );


        ctx.strokeStyle =
          "rgba(100,100,100,0.25)";


        ctx.lineWidth =
          1;


        ctx.stroke();

      }


      /* 驗證碼文字 */

      ctx.font =
        "bold 34px Arial";


      ctx.textBaseline =
        "middle";


      for (
        let i = 0;
        i < currentCaptcha.length;
        i++
      ) {

        const char =
          currentCaptcha[i];


        const x =
          18 +
          i * 31;


        const y =

          canvas.height /
          2 +

          (
            Math.random() *
            8 -
            4
          );


        const angle =

          Math.random() *
          0.35 -
          0.175;


        ctx.save();


        ctx.translate(
          x,
          y
        );


        ctx.rotate(
          angle
        );


        ctx.fillStyle =
          "#2f4fb3";


        ctx.fillText(
          char,
          0,
          0
        );


        ctx.restore();

      }

    }


    /* ---------------------------------------------------------
       驗證碼檢查
    --------------------------------------------------------- */

    function validateCaptcha() {

      const captchaInput =
        document.getElementById(
          "captchaInput"
        );


      const captchaError =
        document.getElementById(
          "captchaError"
        );


      if (!captchaInput) {

        alert(
          "找不到驗證碼輸入欄位。"
        );

        return false;

      }


      const userInput =
        captchaInput
          .value
          .trim()
          .toUpperCase();


      const correctCaptcha =
        String(
          currentCaptcha ||
          ""
        )
          .trim()
          .toUpperCase();


      if (!userInput) {

        if (captchaError) {

          captchaError.style.display =
            "block";

          captchaError.textContent =
            "請輸入驗證碼。";

        }


        captchaInput.focus();


        return false;

      }


      if (
        userInput !==
        correctCaptcha
      ) {

        if (captchaError) {

          captchaError.style.display =
            "block";

          captchaError.textContent =
            "驗證碼錯誤，請重新輸入。";

        }


        generateCaptcha();


        captchaInput.value =
          "";


        captchaInput.focus();


        return false;

      }


      if (captchaError) {

        captchaError.style.display =
          "none";

      }


      return true;

    }


    /* ---------------------------------------------------------
       載入驗證碼語音
    --------------------------------------------------------- */

    function loadCaptchaVoices() {

      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {

        return;

      }


      captchaVoices =
        window
          .speechSynthesis
          .getVoices();

    }


    if (
      "speechSynthesis"
      in window
    ) {

      loadCaptchaVoices();


      window
        .speechSynthesis
        .addEventListener(

          "voiceschanged",

          loadCaptchaVoices

        );

    }


    /* ---------------------------------------------------------
       驗證碼語音播放
    --------------------------------------------------------- */

    function speakCaptcha() {

      if (!currentCaptcha) {

        alert(
          "目前沒有可播放的驗證碼。"
        );

        return;

      }


      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {

        alert(
          "此瀏覽器不支援語音播放。"
        );

        return;

      }


      window
        .speechSynthesis
        .cancel();


      const spokenText =

        "驗證碼是，" +

        currentCaptcha
          .split("")
          .join("，");


      const utterance =
        new SpeechSynthesisUtterance(
          spokenText
        );


      utterance.lang =
        "zh-TW";


      if (
        captchaVoices.length ===
        0
      ) {

        captchaVoices =

          window
            .speechSynthesis
            .getVoices();

      }


      const bestVoice =

        captchaVoices.find(

          function (voice) {

            return (

              voice.name.includes(
                "Google"
              ) &&

              voice.lang ===
                "zh-TW"

            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return (

              voice.name.includes(
                "Google"
              ) &&

              voice.lang.includes(
                "zh"
              )

            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return voice.name.includes(
              "Microsoft Yating"
            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return voice.name.includes(
              "Microsoft HsiaoChen"
            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return (
              voice.lang ===
              "zh-TW"
            );

          }

        );


      if (bestVoice) {

        utterance.voice =
          bestVoice;

      }


      utterance.rate =
        0.8;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      window
        .speechSynthesis
        .speak(
          utterance
        );

    }

            function (event) {

              if (
                event.key ===
                "Enter"
              ) {

                event.preventDefault();

        /* -----------------------------------------
           Direct Self Pay

           index.html 若已將基本資料放進：
           sessionStorage.directSelfPayBasicData

           並跳轉：
           appointment2.html?directSelfPay=1
        ----------------------------------------- */

              "directSelfPayBasicData 解析失敗：",

            );

          }


          appointmentData = {

            plan:
              "SELF_PAY",

            planName:
              "自費健康檢查",

            name:
              savedBasicData.name ||
              directParams.get("name") ||
              "",

            pid:
              savedBasicData.pid ||
              directParams.get("pid") ||
              "",

            phone:
              savedBasicData.phone ||
              directParams.get("phone") ||
              "",

            birthday:
              savedBasicData.birthday ||
              directParams.get("birthday") ||
              "",

            date:
              "",

            time:
              "",

            breakfast:
              "",

            captcha:
              "",

            selfPayItems:
              [],

            selfPayTotal:
              0

          };


          setTimeout(
            function () {

              openSelfPayChat();

            },
            300
          );

        }

      }
    );

  </script>
