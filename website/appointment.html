<h1 id="eligibility-title"><span data-eligibility-text="老人健檢資格確認">老人健檢資格確認</span></h1><p class="intro"><span data-eligibility-text="請確認以下三項資格。符合資格後，即可進入下一步核對預約資料。">請確認以下三項資格。符合資格後，即可進入下一步核對預約資料。</span></p>
<form id="frm2"><input type="hidden" name="project_type" id="project_type" value="A"><div class="cards">
<fieldset aria-labelledby="question-1"><div class="qhead"><span class="qno" aria-hidden="true">01</span><p id="question-1" class="question"><span data-eligibility-text="您是設籍台北市的市民嗎？">您是設籍台北市的市民嗎？</span></p></div><div class="choices"><label class="choice"><input type="radio" name="city_type" id="city_type1" onclick="handleClick1(this)" value="1" checked><span data-eligibility-text="是">是</span></label><label class="choice"><input type="radio" name="city_type" id="city_type2" onclick="handleClick1(this)" value="2"><span data-eligibility-text="不是">不是</span></label></div></fieldset>
<fieldset aria-labelledby="question-2"><div class="qhead"><span class="qno" aria-hidden="true">02</span><p id="question-2" class="question"><span data-eligibility-text="您是年滿65歲以上長者或55歲以上原住民嗎？">您是年滿65歲以上長者或55歲以上原住民嗎？</span></p></div><div class="choices"><label class="choice"><input type="radio" name="age_type" id="age_type1" onclick="handleClick2(this)" value="1" checked><span data-eligibility-text="是">是</span></label><label class="choice"><input type="radio" name="age_type" id="age_type2" onclick="handleClick2(this)" value="2"><span data-eligibility-text="不是">不是</span></label></div></fieldset>
<fieldset aria-labelledby="question-3"><div class="qhead"><span class="qno" aria-hidden="true">03</span><p id="question-3" class="question"><span data-eligibility-text="您若不符合受檢資格及未依照特約醫事機構規定辦理登記，醫事機構將取消已取號後之登記資格，您同意嗎？">您若不符合受檢資格及未依照特約醫事機構規定辦理登記，醫事機構將取消已取號後之登記資格，您同意嗎？</span></p></div><div class="choices"><label class="choice"><input type="radio" name="c_type" id="c_type1" onclick="handleClick3(this)" value="1" checked><span data-eligibility-text="同意">同意</span></label><label class="choice"><input type="radio" name="c_type" id="c_type2" onclick="handleClick3(this)" value="2"><span data-eligibility-text="不同意">不同意</span></label></div></fieldset>
</div><div class="actions"><p class="helper"><span data-eligibility-text="下一步將核對您的預約資料。">下一步將核對您的預約資料。</span></p><button class="next" id="nextStepBtn" type="button" onclick="goNextStep()"><span data-eligibility-text="下一步：確認資料　→">下一步：確認資料　→</span></button></div></form>

<script src="https://unpkg.com/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let citytypeValue = 1;
    let agetypeValue = 1;
    let ctypeValue = 1;

    function handleClick1(ele) { citytypeValue = ele.value; }
    function handleClick2(ele) { agetypeValue = ele.value; }
    function handleClick3(ele) { ctypeValue = ele.value; }

    function goNextStep() {
       if (citytypeValue == 2 || agetypeValue == 2 || ctypeValue == 2){
            alert("不符資格，無法預約");
            return false;
       }

       // 🌟 完整抓取 7 個參數，接力傳遞
       const urlParams = new URLSearchParams(window.location.search);
       let p = urlParams.get('p');
       if (!p) {
           const projElem = document.getElementById('project_type');
           p = projElem ? projElem.value : 'A';
       }
       const name = encodeURIComponent(urlParams.get('name') || '');
       const pid = encodeURIComponent(urlParams.get('pid') || '');
       const phone = encodeURIComponent(urlParams.get('phone') || '');
       const birthday = encodeURIComponent(urlParams.get('birthday') || '');
       const date = encodeURIComponent(urlParams.get('date') || '');
       const time = encodeURIComponent(urlParams.get('time') || '');

       p = encodeURIComponent(p);

       // 🚀 正確路徑：傳送到 appointment2.html
       const nextUrl = "appointment2.html?p=" + p + "&name=" + name + "&pid=" + pid + "&phone=" + phone + "&birthday=" + birthday + "&date=" + date + "&time=" + time;
       const destination = new URL(nextUrl, window.location.href);
       const clinic = urlParams.get('clinic');
       if (clinic === 'shanlin' || clinic === 'yidian') destination.searchParams.set('clinic', clinic);
       window.location.href = destination.href;
    }

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        let p = urlParams.get('p');
        if (p) {
            document.getElementById('project_type').value = p;
        }
    });
  </script>
