                                <label class="form-check-label" for="city_type2">不是</label>
                            </div>
                        </div>

                        <div class="col-12">
                          <label for="inputState" class="form-label">2. 您是年滿65歲以上長者或55歲以上原住民嗎? </label>
                        </div>
                        <div class="col-12">                        
                            <div class="form-check form-check-inline col-md-2">
                                <input class="form-check-input" type="radio" name="age_type" id="age_type1" onclick="handleClick2(this);" value="1" checked>

                            </div>
                            <div class="form-check form-check-inline col-md-2">
                                <input class="form-check-input" type="radio" name="age_type" id="age_type2" onclick="handleClick2(this);" value="2">

                            </div>
                        </div>

                        <div class="col-12">
                          <label for="inputState" class="form-label">3. 您若不符合受檢資格及未依照特約醫事機構規定辦理登記.醫事機構將取消已取號後之登記資格,您同意嗎? </label>
                        </div>
                        <div class="col-12">                        
                            <div class="form-check form-check-inline col-md-2">
                                <input class="form-check-input" type="radio" name="c_type" id="c_type1" onclick="handleClick3(this);" value="1" checked>
                                <label class="form-check-label" for="c_type1">同意</label>
                            </div>
                            <div class="form-check form-check-inline col-md-2">

                        <div class="col-4"></div>

                        <div class="col-12 my-3">

  <script>
    let citytypeValue = 1;
    let agetypeValue = 1;
    let ctypeValue = 1;

    function handleClick1(ele) { citytypeValue = ele.value; }
    function handleClick2(ele) { agetypeValue = ele.value; }
    function handleClick3(ele) { ctypeValue = ele.value; }

    function goNextStep() {
       if (citytypeValue == 2 || agetypeValue == 2 || ctypeValue == 2){
            alert("不符資格，無法預約");
            return false;
       }

       // 🌟 完整抓取 7 個參數，接力傳遞
       const urlParams = new URLSearchParams(window.location.search);
       let p = urlParams.get('p');
       if (!p) {
           const projElem = document.getElementById('project_type');
           p = projElem ? projElem.value : 'A';
       }
       const name = urlParams.get('name') || '';
       const pid = urlParams.get('pid') || '';
       const phone = urlParams.get('phone') || '';
       const birthday = urlParams.get('birthday') || '';
       const date = urlParams.get('date') || '';
       const time = urlParams.get('time') || '';

       // 🚀 正確路徑：傳送到 appointment2.html
       const nextUrl = "appointment2.html?p=" + p + "&name=" + name + "&pid=" + pid + "&phone=" + phone + "&birthday=" + birthday + "&date=" + date + "&time=" + time;
       window.location.href = nextUrl;
    }

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        let p = urlParams.get('p');
        if (p) {
            document.getElementById('project_type').value = p;
        }
    });
  </script>
