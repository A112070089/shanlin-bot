  <style>

    /* =========================================
       基本資料頁
    ========================================= */

    .form-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.05);

      margin-top: 20px;
    }


    .display-plan {
      color: #dc3545;
      font-weight: bold;

      border-bottom:
        2px solid #eeeeee;

      padding-bottom: 10px;
      margin-bottom: 20px;
    }


    .form-label {
      font-weight: 600;
      color: #444444;
      margin-top: 15px;
    }


    .hint-text {
      color: #888888;
      font-size: 0.9rem;
      margin-top: 5px;
    }


    input.form-control,
    select.form-control {
      width: 100%;
      box-sizing: border-box;

      border:
        1px solid #dddddd;

      border-radius: 8px;
      padding: 12px;
    }


    .btn-send {
      border: none;
      border-radius: 8px;

      padding:
        12px 36px;

      background: #3f51b5;
      color: #ffffff;

      font-size: 1.05rem;
      font-weight: 700;

      cursor: pointer;
    }


    .btn-send:hover {
      background: #33449d;
    }


    /* =========================================
       AI 自費聊天室 Overlay
    ========================================= */

    .selfpay-chat-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(32, 45, 65, 0.58);
    }


    .selfpay-chat-overlay.show {
      display: flex;
    }


    /* =========================================
       AI 自費聊天室
    ========================================= */

    .selfpay-chat-box {
      width:
        min(560px, 96vw);

      height:
        min(760px, 90vh);

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border-radius: 24px;
      background: #ffffff;

      box-shadow:
        0 20px 65px rgba(0, 0, 0, 0.28);
    }


    .selfpay-chat-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding:
        20px 22px;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #3f51b5,
          #1976f3
        );
    }


    .selfpay-chat-title-small {
      margin-bottom: 3px;
      font-size: 13px;
      opacity: 0.86;
    }


    .selfpay-chat-title {
      font-size: 21px;
      font-weight: 800;
    }


    .selfpay-chat-close {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 50%;

      background:
        rgba(
          255,
          255,
          255,
          0.18
        );

      color: #ffffff;

      font-size: 27px;
      cursor: pointer;
    }


    .selfpay-chat-close:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.3
        );
    }


    /* =========================================
       聊天內容
    ========================================= */

    .selfpay-chat-body {
      flex: 1;
      min-height: 0;

      overflow-y: scroll;
      overflow-x: hidden;

      padding: 20px;

      background: #f6f8fc;

      scroll-behavior: smooth;

      scrollbar-width: auto;
      scrollbar-color: #5b6fd8 #e9edf5;
    }


    .selfpay-chat-body::-webkit-scrollbar {
      width: 14px;
    }


    .selfpay-chat-body::-webkit-scrollbar-track {
      background: #e9edf5;
      border-radius: 10px;
    }


    .selfpay-chat-body::-webkit-scrollbar-thumb {
      background: #5b6fd8;
      border-radius: 10px;

      border:
        3px solid #e9edf5;
    }


    .selfpay-chat-body::-webkit-scrollbar-thumb:hover {
      background: #3f51b5;
    }


    .selfpay-message {
      max-width: 86%;

      margin-bottom: 14px;

      padding:
        13px 16px;

      border-radius: 18px;

      font-size: 16px;
      line-height: 1.65;

      word-break: break-word;
    }


    .selfpay-message.ai {
      margin-right: auto;

      border:
        1px solid #e0e6ef;

      background: #ffffff;
      color: #253756;
    }


    .selfpay-message.user {
      margin-left: auto;

      background: #3f51b5;
      color: #ffffff;
    }


    /* =========================================
       快速選項
    ========================================= */

    .selfpay-chat-options {
      display: flex;
      flex-shrink: 0;
      flex-wrap: wrap;

      align-content: flex-start;

      gap: 9px;

      padding:
        16px 17px;

      border-top:
        1px solid #e7eaf0;

      background: #ffffff;

      max-height: 430px;

      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-width: auto;
      scrollbar-color: #5b6fd8 #edf0f6;
    }


    .selfpay-chat-options::-webkit-scrollbar {
      width: 14px;
    }


    .selfpay-chat-options::-webkit-scrollbar-track {
      background: #edf0f6;
      border-radius: 10px;
    }


    .selfpay-chat-options::-webkit-scrollbar-thumb {
      background: #5b6fd8;
      border-radius: 10px;

      border:
        3px solid #edf0f6;
    }


    .selfpay-chat-options::-webkit-scrollbar-thumb:hover {
      background: #3f51b5;
    }


    .selfpay-option-btn {
      border:
        1px solid #3f51b5;

      border-radius: 999px;

      padding:
        8px 15px;

      background: #ffffff;
      color: #3f51b5;

      font-weight: 700;

      cursor: pointer;
    }


    .selfpay-option-btn:hover {
      background: #3f51b5;
      color: #ffffff;
    }


    /* =========================================
       狀態顯示
    ========================================= */

    .selfpay-status {
      display: none;

      padding:
        8px 18px;

      border-top:
        1px solid #eef1f5;

      background: #ffffff;

      color: #68788e;
      font-size: 13px;
    }


    /* =========================================
       輸入區
    ========================================= */

    .selfpay-chat-input-area {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 14px;

      border-top:
        1px solid #e5e7eb;

      background: #ffffff;
    }


    #selfpay-chat-input {
      flex: 1;
      min-width: 0;

      border:
        1px solid #d4dae5;

      border-radius: 999px;

      padding:
        12px 14px;

      outline: none;

      font-size: 15px;
    }


    #selfpay-chat-input:focus {
      border-color: #3f51b5;

      box-shadow:
        0 0 0 3px rgba(

          181,

    }


    .selfpay-send-btn,
    .selfpay-mic-btn {
      border: none;
      border-radius: 999px;

      background: #3f51b5;
      color: #ffffff;

      cursor: pointer;
      font-weight: 700;
    }


    .selfpay-send-btn {

    .selfpay-mic-btn {
      width: 44px;

    .selfpay-item-name {

        padding: 0;
      }


      .selfpay-chat-box {
        width: 100%;
        height: 100%;

        border-radius: 0;
      }

    }

  </style>

  <script>

    "use strict";


    /* =========================================
       API
    ========================================= */

    const API_BASE =
      "http://127.0.0.1:8000";


    const SELF_PAY_API_BASE =
      `${API_BASE}/api/self_pay`;


    /* =========================================
       老人健檢方案
    ========================================= */

    const planMap = {

      A:
        "A方案 腦肺方案",

      B:
        "B方案 腹部方案",

      C:
        "C方案 骨密肌力方案"

    };


    /* =========================================
       狀態
    ========================================= */

    let currentPlan =
      "A";


    let appointmentData =
      {};


    let selfPayChatMode =
      "ask";

    let selfPayStep =
      "";

    let selfPaySelectedDate =
      "";

    let selfPaySelectedSession =
      "";

    let selfPayBudget =
      0;

    let selfPayRemainingBudget =
      0;

    let selfPaySelectedTotal =
      0;

    let pendingOverBudgetSelection =
      null;


    let selfPayCategories =
      [];


    let currentSelfPayCategory =
      null;


    let currentSelfPayItems =
      [];


    let currentSelfPayItem =
      null;


    let currentSelfPayBillable =
      null;


    let selfPaySelectedItems =
      [];


    let selfPayMediaRecorder =
      null;


    let selfPayAudioChunks =
      [];


    let selfPayStream =
      null;


    let selfPayRecording =
      false;


    /* =========================================
       頁面初始化
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        /* =====================================
           1. 取得網址參數
        ===================================== */

        const params =
          new URLSearchParams(
            window.location.search
          );


        currentPlan =
          params.get("p") ||
          params.get("plan") ||
          "A";


        const directSelfPayBasicData =
          JSON.parse(
            sessionStorage.getItem(
              "directSelfPayBasicData"
            ) || "{}"
          );


        const name =
          params.get("name") ||
          directSelfPayBasicData.name ||
          "";


        const pid =
          params.get("pid") ||
          directSelfPayBasicData.pid ||
          "";


        const phone =
          params.get("phone") ||
          directSelfPayBasicData.phone ||
          "";


        const birthday =
          params.get("birthday") ||
          directSelfPayBasicData.birthday ||
          "";


        const rawDate =
          params.get("date") ||
          "";


        const rawTime =
          params.get("time") ||
          "";


        /* =====================================
           2. 日期格式統一

           支援：
           2026-05-01
           2026/05/01
           5/1
           5月1日
           5月1號
        ===================================== */

        function normalizeBookingDate(value) {

          const text =
            String(value || "").trim();

          if (!text) {
            return "";
          }


          /* YYYY-MM-DD / YYYY/MM/DD */

          let match =
            text.match(
              /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
            );

          if (match) {

            const year =
              match[1];

            const month =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[3])
              ).padStart(
                2,
                "0"
              );

            return (
              `${year}-${month}-${day}`
            );

          }


          /* M/D */

          match =
            text.match(
              /^(\d{1,2})\/(\d{1,2})$/
            );

          if (match) {

            const month =
              String(
                Number(match[1])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            return (
              `2026-${month}-${day}`
            );

          }


          /* M月D日 / M月D號 */

          match =
            text
              .replace(
                /\s+/g,
                ""
              )
              .match(
                /^(\d{1,2})月(\d{1,2})(?:日|號)?$/
              );

          if (match) {

            const month =
              String(
                Number(match[1])
              ).padStart(
                2,
                "0"
              );

            const day =
              String(
                Number(match[2])
              ).padStart(
                2,
                "0"
              );

            return (
              `2026-${month}-${day}`
            );

          }


          return "";

        }


        function normalizeBookingTime(value) {

          const text =
            String(value || "")
              .trim()
              .replace(
                /\s+/g,
                ""
              );

          if (!text) {
            return "";
          }


          /* HH:MM / H:MM */

          let match =
            text.match(
              /^(\d{1,2}):(\d{2})$/
            );

          if (match) {

            const hour =
              Number(match[1]);

            const minute =
              Number(match[2]);


            if (
              hour >= 0 &&
              hour <= 23 &&
              minute >= 0 &&
              minute <= 59
            ) {

              return (
                `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`
              );

            }

          }


          /* 上午 / 下午 + H點 */

          match =
            text.match(
              /^(上午|下午)?(\d{1,2})點(?:(\d{1,2})分|半)?$/
            );

          if (match) {

            let hour =
              Number(match[2]);

            const minute =
              text.endsWith("半")
                ? 30
                : Number(
                    match[3] || 0
                  );


            if (
              match[1] === "下午" &&
              hour < 12
            ) {
              hour += 12;
            }


            if (
              match[1] === "上午" &&
              hour === 12
            ) {
              hour = 0;
            }


            if (
              hour >= 0 &&
              hour <= 23 &&
              minute >= 0 &&
              minute <= 59
            ) {

              return (
                `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`
              );

            }

          }


          return "";

        }


        const date =
          normalizeBookingDate(

          rawPrice !== undefined &&

        ) {

        const priceText =
          price === null

            ? "價格需向診所確認"

            : `NT$${price.toLocaleString(
                "zh-TW"

        /* =========================================
       建立可加入清單的 billable unit

       如果使用者點的是套組中的細項，
       只要後端回傳相同 billable key，
       就只加入一次、不重複計價。
    ========================================= */

    function buildCurrentSelfPaySelection() {

      if (
        !currentSelfPayItem ||
        !currentSelfPayBillable
      ) {

        return null;

      }


      const itemId =
        currentSelfPayItem.id ??
        currentSelfPayItem.item_id ??
        currentSelfPayItem.key ??
        "";


      const billableId =
        currentSelfPayBillable.id ??
        currentSelfPayBillable.billable_id ??
        currentSelfPayBillable.key ??
        itemId;


      const name =
        currentSelfPayBillable.name ||
        currentSelfPayItem.name ||
        "自費檢查";


      const rawPrice =
        currentSelfPayBillable.price;


      let price =
        null;


      if (
        rawPrice !== null &&
        rawPrice !== undefined &&
        rawPrice !== ""
      ) {

        const converted =
          Number(
            rawPrice
          );


        if (
          Number.isFinite(
            converted
          )
        ) {

          price =
            converted;

        }

      }


      const includedItems =
        Array.isArray(
          currentSelfPayBillable
            .included_items
        )
          ? currentSelfPayBillable
              .included_items
          : [];


      return {

        key:
          String(
            billableId
          ),

        itemId:
          String(
            itemId
          ),

        name:
          String(
            name
          ),

        price:
          price,

        type:
          currentSelfPayBillable.type ||
          (
            includedItems.length
              ? "package"
              : "single"
          ),

        includedItems:
          includedItems

      };

    }


    /* =========================================
       是否已加入同一個 billable unit
    ========================================= */

    function isSelfPayItemSelected(
      selection
    ) {

      if (!selection) {

        return false;

      }


      return selfPaySelectedItems.some(
        function (selected) {

          return (
            String(
              selected.key
            ) ===
            String(
              selection.key
            )
          );

        }
      );

    }


    /* =========================================
       計算目前自費總額
    ========================================= */

    function calculateSelfPayTotal() {

      return selfPaySelectedItems.reduce(
        function (
          total,
          item
        ) {

          const price =
            Number(
              item.price
            );


          if (
            !Number.isFinite(
              price
            )
          ) {

            return total;

          }


          return (
            total +
            price
          );

        },
        0
      );

    }


    /* =========================================
       加入自費項目

       注意：
       預算是「參考預算」，
       超過時不是禁止加入，
       而是要求使用者二次確認。
    ========================================= */

    function addCurrentSelfPayItem() {

      const selection =
        buildCurrentSelfPaySelection();


      if (!selection) {

        return {

          success:
            false,

          reason:
            "missing"

        };

      }


      if (
        isSelfPayItemSelected(
          selection
        )
      ) {

        return {

          success:
            false,

          reason:
            "duplicate",

          item:
            selection

        };

      }


      const currentTotal =
        calculateSelfPayTotal();


      const newItemPrice =
        Number(
          selection.price || 0
        );


      const newTotal =
        currentTotal +
        newItemPrice;


      /* -----------------------------------------
         超過參考預算
      ----------------------------------------- */

      if (
        selfPayBudget > 0 &&
        newTotal > selfPayBudget
      ) {

        const overAmount =
          newTotal -
          selfPayBudget;


        return {

          success:
            false,

          reason:
            "budget_confirmation_required",

          selection:
            selection,

          currentTotal:
            currentTotal,

          newTotal:
            newTotal,

          overAmount:
            overAmount

        };

      }


      /* -----------------------------------------
         沒有超過預算，直接加入
      ----------------------------------------- */

      selfPaySelectedItems.push(
        selection
      );


      selfPaySelectedTotal =
        calculateSelfPayTotal();


      selfPayRemainingBudget =
        selfPayBudget -
        selfPaySelectedTotal;


      return {

        success:
          true,

        item:
          selection

      };

    }

       顯示目前已選清單

    function showSelectedSelfPayItems() {

      if (
        selfPaySelectedItems.length ===
        0
      ) {

        addSelfPayAIMessage(
          "目前還沒有加入任何自費檢查項目。"
        );

        return;

      }


      const rows =
        selfPaySelectedItems.map(
          function (
            item,
            index
          ) {

            const price =
              Number(
                item.price
              );


            const priceText =
              Number.isFinite(
                price
              )
                ? `NT$${price.toLocaleString(
                    "zh-TW"
                  )}`
                : "價格需確認";


            return (
              `${index + 1}. ` +
              `${escapeHtml(
                item.name
              )}` +
              `｜` +
              `${escapeHtml(
                priceText
              )}`
            );

          }
        );


      const total =
        calculateSelfPayTotal();


      const budgetText =
        selfPayBudget > 0

          ? (
              `<br><br>` +
              `參考預算：` +
              `<strong>NT$${selfPayBudget.toLocaleString(
                "zh-TW"
              )}</strong>`
            )

          : "";


      const difference =
        selfPayBudget > 0
          ? selfPayBudget - total
          : 0;


      let remainingText =

      if (
        selfPayBudget > 0
      ) {

        if (
          difference >= 0
        ) {

          remainingText =
            `<br>` +
            `預算尚餘：` +
            `<strong>NT$${difference.toLocaleString(
              "zh-TW"
            )}</strong>`;

        } else {

          remainingText =
            `<br>` +
            `目前超出參考預算：` +
            `<strong>NT$${Math.abs(
              difference
            ).toLocaleString(
              "zh-TW"
            )}</strong>`;

        }

      }


      addSelfPayAIMessage(
        `
          <div class="selfpay-summary-card">

            <strong>
              目前已選自費項目
            </strong>

            <br><br>

            ${rows.join("<br>")}

              自費合計：
              NT$${total.toLocaleString(
                "zh-TW"
              )}

              ${budgetText}

              ${remainingText}

            </div>

          </div>
        `
      );

    }

    /* =========================================
       找分類
    ========================================= */

    function findCategoryIdByText(
      text
    ) {

      const normalized =
        String(
          text ||
          ""
        )
          .trim()
          .toLowerCase();


      if (!normalized) {

        return null;

      }


      const matched =
        selfPayCategories.find(
          function (category) {

            const id =
              String(
                category.id ||
                ""
              );


            const name =
              String(
                category.name ||
                ""
              )
                .toLowerCase();


            if (
              name &&
              normalized.includes(
                name
              )
            ) {

              return true;

            }


            if (
              id ===
              "cardiovascular"
            ) {

              return (
                normalized.includes(
                  "心"
                ) ||
                normalized.includes(
                  "血管"
                )
              );

            }


            if (
              id ===
              "pulmonary"
            ) {

              return (
                normalized.includes(
                  "肺"
                )
              );

            }


            if (
              id ===
              "hepatobiliary_gastrointestinal"
            ) {

              return (

                normalized.includes(
                  "肝"
                ) ||

                normalized.includes(
                  "膽"
                ) ||

                normalized.includes(
                  "胃"
                ) ||

                normalized.includes(
                  "腸"
                )

              );

            }


            if (
              id ===
              "renal_urology"
            ) {

              return (

                normalized.includes(
                  "腎"
                ) ||

                normalized.includes(
                  "泌尿"
                )

              );

            }


            if (
              id ===
              "other_value_added"
            ) {

              return (

                normalized.includes(
                  "其他"
                ) ||

                normalized.includes(
                  "加值"
                )

              );

            }


            return false;

          }
        );


      return matched
        ? matched.id
        : null;

    }


    /* =========================================
       找檢查項目
    ========================================= */

    function findItemIdByText(
      text
    ) {

      const normalized =
        String(
          text ||
          ""
        )
          .trim()
          .toLowerCase();


      if (!normalized) {

        return null;

      }


      const matched =
        currentSelfPayItems.find(
          function (item) {

            const name =
              String(
                item.name ||
                ""
              )
                .toLowerCase();


            return (
              name &&
              (
                normalized.includes(
                  name
                ) ||
                name.includes(
                  normalized
                )
              )
            );

          }
        );


      return matched
        ? (
            matched.id ??
            matched.item_id ??
            matched.key
          )
        : null;

    }

      );

        input,

          locale:
            "zh_tw",

          dateFormat:
            "Y-m-d",

          minDate:
            "today",

          inline:
            true,


          /* =====================================
             日期禁用規則
          ===================================== */

          disable: [

            function (date) {

              const now =
                new Date();


              const isToday =
                date.getFullYear() ===
                  now.getFullYear() &&

                date.getMonth() ===
                  now.getMonth() &&

                date.getDate() ===
                  now.getDate();


              const weekDay =
                date.getDay();


              /* 星期日永遠不能選 */

              if (
                weekDay ===
                0
              ) {

                return true;

              }


              /* -------------------------------
                 今天
              -------------------------------- */

              if (isToday) {


                /* 今天如果是星期六：
                   當日上午不能預約，
                   星期六也沒有下午診，
                   所以今天整天不能選 */

                if (
                  weekDay ===
                  6
                ) {

                  return true;

                }


                /* 週一～週五：
                   10:30 後，
                   今日下午診也停止受理 */

                const currentMinutes =
                  now.getHours() *
                  60 +
                  now.getMinutes();


                const cutoffMinutes =
                  10 *
                  60 +
                  30;


                if (
                  currentMinutes >=
                  cutoffMinutes
                ) {

                  return true;

                }

              }


              return false;

            }

          ],


          /* =====================================
             使用者選擇日期
          ===================================== */

          onChange:
            function (
              selectedDates
            ) {

              if (
                !selectedDates.length
              ) {

                return;

              }


              const selectedDate =
                selectedDates[0];


              const month =
                selectedDate.getMonth() +
                1;


              const day =
                selectedDate.getDate();


              const weekDay =
                selectedDate.getDay();


              const now =
                new Date();


              const isToday =
                selectedDate.getFullYear() ===
                  now.getFullYear() &&

                selectedDate.getMonth() ===
                  now.getMonth() &&

                selectedDate.getDate() ===
                  now.getDate();


              const currentMinutes =
                now.getHours() *
                60 +
                now.getMinutes();


              const cutoffMinutes =
                10 *
                60 +
                30;


              const year =
  selectedDate.getFullYear();

const monthText =
  String(month).padStart(2, "0");

const dayText =
  String(day).padStart(2, "0");

selfPaySelectedDate =
  `${year}-${monthText}-${dayText}`;


              addSelfPayUserMessage(
                `${month}/${day}`
              );


              clearSelfPayOptions();


              selfPayStep =
                "session";


              /* =====================================
                 今天
              ===================================== */

              if (isToday) {


                /* 星期六今天 */

                if (
                  weekDay ===
                  6
                ) {

                  addSelfPayAIMessage(

                    `您選擇的是今天 ${month}/${day}。<br><br>` +

                    `📌 當天上午診無法預約，` +

                    `星期六亦無下午診。<br><br>` +

                    `請重新選擇其他日期。`,

                    false

                  );


                  selfPayStep =
                    "date";


                  setTimeout(
                    function () {

                      showSelfPayCalendar();

                    },
                    300
                  );


                  return;

                }


                /* 週一～週五今天，10:30 後 */

                if (
                  currentMinutes >=
                  cutoffMinutes
                ) {

                  addSelfPayAIMessage(

                    `您選擇的是今天 ${month}/${day}。<br><br>` +

                    `📌 當天上午診無法預約，` +

                    `且目前已超過 10:30，` +

                    `下午診亦停止受理。<br><br>` +

                    `請重新選擇其他日期。`,

                    false

                  );


                  selfPayStep =
                    "date";


                  setTimeout(
                    function () {

                      showSelfPayCalendar();

                    },
                    300
                  );


                  return;

                }


                /* 週一～週五今天，10:30 前：
                   只能選下午診 */

                addSelfPayAIMessage(

                  `您選擇的是今天 ${month}/${day}。<br><br>` +

                  `📌 當天上午診無法預約。<br>` +

                  `目前尚未超過 10:30，` +

                  `可預約今日下午診。`,

                  false

                );


                showSelfPayOptions([

                    label:
                      "下午診（13:30–17:30）",

                    value:
                      "afternoon"
                  }

                ]);


                return;

              }


              /* =====================================
                 未來星期六
              ===================================== */

              if (

                6
              ) {

                addSelfPayAIMessage(

                  `好的，已選擇 ${month}/${day}。<br><br>` +

                  `📌 星期六診所僅提供上午診。<br><br>` +

                showSelfPayOptions([

                      "morning"

            showAfterAddOptions();


            return;

          }


          /* -------------------------------
             超過參考預算
          -------------------------------- */

          if (
            result.reason ===
            "budget_confirmation_required"
          ) {

            pendingOverBudgetSelection =
              result.selection;


            addSelfPayAIMessage(

              `⚠️ 加入這個項目後會超過您原先設定的參考預算。<br><br>` +

              `原定預算：` +

              `<strong>NT$${selfPayBudget.toLocaleString(
                "zh-TW"
              )}</strong><br>` +

              `加入後合計：` +

              `<strong>NT$${result.newTotal.toLocaleString(
                "zh-TW"
              )}</strong><br>` +

              `將超出：` +

`<strong style="color:#dc3545;">NT$${result.overAmount.toLocaleString(
  "zh-TW"
)}</strong><br><br>` +

              `預算僅供規劃參考，` +

              `您仍可以繼續加購。<br><br>` +

              `請問確定要加入這個項目嗎？`,

              false

            );


            selfPayChatMode =
              "confirmOverBudget";


            showSelfPayOptions([

              {
                label:
                  "仍要加購",

                value:
                  "confirm-over-budget"
              },

              {
                label:
                  "先不要",

                value:
                  "cancel-over-budget"
              }

            ]);


            return;

          }


          /* -------------------------------
             其他加入失敗
          -------------------------------- */

          if (
            !result.success
          ) {

            addSelfPayAIMessage(
              "目前無法加入這個項目，請重新選擇。"
            );


            selfPayChatMode =
              "item";


            showSelfPayItemButtons();


            return;

          }


          /* -------------------------------
             正常加入成功
          -------------------------------- */

          selfPaySelectedTotal =
            calculateSelfPayTotal();


          selfPayRemainingBudget =
            selfPayBudget -
            selfPaySelectedTotal;


          const price =
            Number(
              result.item.price
            );


          const priceText =
            Number.isFinite(
              price
            )

              ? `NT$${price.toLocaleString(
                  "zh-TW"
                )}`

              : "價格需確認";


          let budgetStatusText =
            "";


          if (
            selfPayBudget > 0
          ) {

            if (
              selfPayRemainingBudget >=
              0
            ) {

              budgetStatusText =

                `<br>` +

                `預算尚餘：` +

                `<strong>NT$${selfPayRemainingBudget.toLocaleString(
                  "zh-TW"
                )}</strong>`;

            }

            else {

              budgetStatusText =

                `<br>` +

                `目前超出參考預算：` +

`<strong style="color:#dc3545;">NT$${Math.abs(
  selfPayRemainingBudget
).toLocaleString(
  "zh-TW"
)}</strong>`;

            }

          }


          addSelfPayAIMessage(

            `✅ 已加入「${escapeHtml(
              result.item.name
            )}」。<br><br>` +

            `本項價格：${escapeHtml(
              priceText
            )}<br>` +

            `目前共選擇 ` +

            `<strong>${selfPaySelectedItems.length}</strong>` +

            ` 項。<br>` +

            `目前合計：` +

            `<strong>NT$${selfPaySelectedTotal.toLocaleString(
              "zh-TW"
            )}</strong>` +

            `${budgetStatusText}`,

            true

          );


          showAfterAddOptions();


          return;

        }


        /* 無法辨識 */

        addSelfPayAIMessage(
          "請問要將這個自費檢查加入清單嗎？"
        );


        showSelfPayOptions([

          {
            label:
              "加入這個項目",

            value:
              "add"
          },

          {
            label:
              "先不要",

            value:
              "cancel-item"
          },

          {
            label:
              "回到這個分類",

            value:
              "back-items"
          }

        ]);


        return;

      }


      /* =====================================
         STEP 5
         加入後
      ===================================== */

      if (
        selfPayChatMode ===
        "afterAdd"
      ) {

        /* 繼續選 */

        if (

          rawValue ===
            "continue" ||

          text.includes(
            "繼續選"
          ) ||

          text.includes(
            "其他項目"
          ) ||

          text.includes(
            "再選"
          )

        ) {

          selfPayChatMode =
            "category";


          addSelfPayAIMessage(
            "好的，請選擇下一個想了解的自費檢查分類。"
          );


          showSelfPayCategoryButtons();


          return;

        }


        /* 完成 */

        if (

          rawValue ===
            "finish" ||

          text.includes(
            "完成"
          ) ||

          text.includes(
            "選好了"
          )

        ) {

          confirmSelfPaySelection();


          return;

        }


        showAfterAddOptions();


        return;

      }


      /* =====================================
         無法辨識
      ===================================== */

      addSelfPayAIMessage(

        `我沒有辨識到這個操作，` +

        `請使用下方按鈕繼續。`

      );


      if (
        selfPayChatMode ===
        "category"
      ) {

        showSelfPayCategoryButtons();

      }

      else if (
        selfPayChatMode ===
        "item"
      ) {

        showSelfPayItemButtons();

      }

      else if (
        selfPayChatMode ===
        "afterAdd"
      ) {

        showAfterAddOptions();

      }

    }

    /* =========================================
       語音開始錄音
    ========================================= */

    async function startSelfPayVoice() {

      if (selfPayRecording) {
        return;
      }


      try {

        selfPayStream =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio: true
            });


        selfPayAudioChunks =
          [];


        selfPayMediaRecorder =
          new MediaRecorder(
            selfPayStream
          );


        selfPayMediaRecorder
          .ondataavailable =
          function (event) {

            if (
              event.data &&
              event.data.size > 0
            ) {

              selfPayAudioChunks.push(
                event.data
              );

            }

          };


        selfPayMediaRecorder
          .onstop =
          async function () {

            const mimeType =
              selfPayMediaRecorder
                .mimeType ||
              "audio/webm";


            const blob =
              new Blob(
                selfPayAudioChunks,
                {
                  type: mimeType
                }
              );


            if (selfPayStream) {

              selfPayStream
                .getTracks()
                .forEach(
                  function (track) {

                    track.stop();

                  }
                );

            }


            selfPayStream =
              null;


            await sendSelfPayVoiceToWhisper(
              blob
            );

          };


        selfPayMediaRecorder
          .start();


        selfPayRecording =
          true;


        const micButton =
          document.getElementById(
            "selfpay-mic-btn"
          );


        if (micButton) {

          micButton.classList.add(
            "recording"
          );

        }


        setSelfPayStatus(
          true,
          "🎤 正在錄音，再按一次麥克風即可送出"
        );

      } catch (error) {

        console.error(
          "麥克風啟動失敗：",
          error
        );


        setSelfPayStatus(
          false
        );


        alert(
          "無法使用麥克風，請確認瀏覽器已允許麥克風權限。"
        );

      }

    }

    ========================================= */

    async function sendSelfPayVoiceToWhisper(
      blob
    ) {

      try {

        const fd =
          new FormData();


        fd.append(
          "file",
          blob,
          "selfpay.webm"
        );


        fd.append(
          "current_name",
          appointmentData.name ||
          ""
        );


        const response =
          await fetch(
            `${API_BASE}/api/whisper_booking`,
            {
              method:
                "POST",

              body:
                fd
            }
          );


        const result =
          await response.json();


        setSelfPayStatus(
          false
        );


        if (
          !response.ok ||
          result.status ===
            "error"
        ) {

          throw new Error(
            result.message ||
            result.detail ||
            `HTTP ${response.status}`
          );

        }


        const recognizedText =

          result.raw_text ||

          result
            ?.result
            ?.translated_text ||

          result.translated_text ||

          "";


        if (
          !recognizedText ||
          !recognizedText.trim()
        ) {

          addSelfPayAIMessage(

            `不好意思，我剛剛沒有聽清楚，` +

            `可以再說一次嗎？`

          );


          return;

        }


        await handleSelfPayAnswer(
          recognizedText,
          recognizedText
        );

      } catch (error) {

        setSelfPayStatus(
          false
        );


        console.error(
          "語音辨識失敗：",
          error
        );


        addSelfPayAIMessage(

          `⚠️ 無法完成語音辨識。<br><br>` +

          `您也可以直接使用文字輸入。`

        );

      }

    }

    let currentCaptcha =
      "";


    let captchaVoices =
      [];


    /* ---------------------------------------------------------
       產生驗證碼
    --------------------------------------------------------- */

    function generateCaptcha() {

      const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


      currentCaptcha =
        "";


      for (
        let i = 0;
        i < 5;
        i++
      ) {

        const index =
          Math.floor(

            Math.random() *
            chars.length

          );


        currentCaptcha +=
          chars[index];

      }


      const canvas =
        document.getElementById(
          "captchaCanvas"
        );


      if (!canvas) {
        return;
      }


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        "#f5f7fa";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* 干擾線 */

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        ctx.beginPath();


        ctx.moveTo(

          Math.random() *
          canvas.width,

          Math.random() *
          canvas.height

        );


        ctx.lineTo(

          Math.random() *
          canvas.width,

          Math.random() *
          canvas.height

        );


        ctx.strokeStyle =
          "rgba(100,100,100,0.25)";


        ctx.lineWidth =
          1;


        ctx.stroke();

      }


      /* 驗證碼文字 */

      ctx.font =
        "bold 34px Arial";


      ctx.textBaseline =
        "middle";


      for (
        let i = 0;
        i < currentCaptcha.length;
        i++
      ) {

        const char =
          currentCaptcha[i];


        const x =
          18 +
          i * 31;


        const y =

          canvas.height /
          2 +

          (
            Math.random() *
            8 -
            4
          );


        const angle =

          Math.random() *
          0.35 -
          0.175;


        ctx.save();


        ctx.translate(
          x,
          y
        );


        ctx.rotate(
          angle
        );


        ctx.fillStyle =
          "#2f4fb3";


        ctx.fillText(
          char,
          0,
          0
        );


        ctx.restore();

      }

    }


    /* ---------------------------------------------------------
       驗證碼檢查
    --------------------------------------------------------- */

    function validateCaptcha() {

      const captchaInput =
        document.getElementById(
          "captchaInput"
        );


      const captchaError =
        document.getElementById(
          "captchaError"
        );


      if (!captchaInput) {

        alert(
          "找不到驗證碼輸入欄位。"
        );

        return false;

      }


      const userInput =
        captchaInput
          .value
          .trim()
          .toUpperCase();


      const correctCaptcha =
        String(
          currentCaptcha ||
          ""
        )
          .trim()
          .toUpperCase();


      if (!userInput) {

        if (captchaError) {

          captchaError.style.display =
            "block";

          captchaError.textContent =
            "請輸入驗證碼。";

        }


        captchaInput.focus();


        return false;

      }


      if (
        userInput !==
        correctCaptcha
      ) {

        if (captchaError) {

          captchaError.style.display =
            "block";

          captchaError.textContent =
            "驗證碼錯誤，請重新輸入。";

        }


        generateCaptcha();


        captchaInput.value =
          "";


        captchaInput.focus();


        return false;

      }


      if (captchaError) {

        captchaError.style.display =
          "none";

      }


      return true;

    }

    /* ---------------------------------------------------------
       驗證碼語音播放
    --------------------------------------------------------- */

    function speakCaptcha() {

      if (!currentCaptcha) {

        alert(
          "目前沒有可播放的驗證碼。"
        );

        return;

      }


      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {

        alert(
          "此瀏覽器不支援語音播放。"
        );

        return;

      }


      window
        .speechSynthesis
        .cancel();


      const spokenText =

        "驗證碼是，" +

        currentCaptcha
          .split("")
          .join("，");


      const utterance =
        new SpeechSynthesisUtterance(
          spokenText
        );


      utterance.lang =
        "zh-TW";


      if (
        captchaVoices.length ===
        0
      ) {

        captchaVoices =

          window
            .speechSynthesis
            .getVoices();

      }


      const bestVoice =

        captchaVoices.find(

          function (voice) {

            return (

              voice.name.includes(
                "Google"
              ) &&

              voice.lang ===
                "zh-TW"

            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return (

              voice.name.includes(
                "Google"
              ) &&

              voice.lang.includes(
                "zh"
              )

            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return voice.name.includes(
              "Microsoft Yating"
            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return voice.name.includes(
              "Microsoft HsiaoChen"
            );

          }

        ) ||

        captchaVoices.find(

          function (voice) {

            return (
              voice.lang ===
              "zh-TW"
            );

          }

        );


      if (bestVoice) {

        utterance.voice =
          bestVoice;

      }


      utterance.rate =
        0.8;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      window
        .speechSynthesis
        .speak(
          utterance
        );

    }
