<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOUBTS｜工程師總控台</title><link rel="stylesheet" href="/platform/assets/platform.css"></head><body><header><div><strong>頤典 DOUBTS</strong><span>工程師平台總控台 · 本機限定</span></div><button id="logout" hidden>登出</button></header><main><section id="login" class="card login"><small>PLATFORM ADMINISTRATOR</small><h1>工程師登入</h1><p>此入口只供平台工程師使用，與診所共用管理帳號不同。</p><form id="loginForm"><label>工程師帳號<input id="username" autocomplete="username" required placeholder="platform_admin"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登入工程師總控台</button></form><p id="loginMessage" role="status"></p><p id="accountHint" class="muted"></p></section><section id="dashboard" hidden><h1>平台總覽</h1><p class="muted">獨立管理山林與頤典。正式預約仍受保護；功能模組開關目前是「預先授權」，不會自動部署新程式。</p><div id="clinics" class="cards"></div><h2>功能模組預先授權</h2><p class="muted">設定哪些診所預計可以使用模組；模組尚未部署時，不會出現在醫護工作頁面。</p><div id="features" class="card"></div><div class="actions"><button id="save" type="button">儲存設定</button><button id="refresh" type="button" class="outline">重新整理</button></div><p id="saveMessage" role="status"></p><h2>本機服務狀態</h2><div class="card" id="health">讀取中…</div><h2>最近操作紀錄</h2><div class="card" id="audit">讀取中…</div></section></main><script src="/platform/assets/platform.js" defer></script></body></html>
