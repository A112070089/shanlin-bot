<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>新診所導入帳密測試｜DOUBTS</title><link rel="stylesheet" href="/platform/assets/platform.css"><link rel="stylesheet" href="/platform/assets/clinic-onboarding-v3.css"></head><body><header><div><strong>頤典 DOUBTS</strong><span>新診所管理帳號本機驗證</span></div></header><main><section class="card login"><h1>新診所帳號測試</h1><p class="muted">本頁只驗證導入帳號，不提供病患資料、正式管理或預約功能。建議使用無痕視窗，避免取代工程師登入狀態。</p><form id="loginForm"><label>診所代號<input id="clinicId" type="text" readonly required></label><label>管理帳號<input id="username" type="text" autocomplete="username" required></label><label>管理密碼<input id="password" type="password" autocomplete="current-password" required></label><button id="loginBtn" type="submit">驗證管理帳密</button></form><p role="status" id="loginStatus"></p><section id="success" hidden><p class="tagline">帳號驗證通過，但此診所仍處於本機導入階段，無病患資料或正式預約權限。</p><p id="identity"></p></section></section></main><script src="/platform/assets/clinic-onboarding-login-v3.js" defer></script></body></html>
