  <script language="javascript">
    var idtypeValue = 1;
    var breakfastValue = 1;
    function handleClick(breakfast) { breakfastValue = breakfast.value; }
    function handleClick2(id_type) { idtypeValue = id_type.value; }
    
    function checkbooking(){
        var dataUrl= "checkbooking.php?rd="+document.getElementById("reserve_date").value+"&rt="+document.getElementById("reserve_time").value;
        var xhr = new XMLHttpRequest();
        xhr.open('GET',dataUrl, true);
        xhr.send();
        xhr.onreadystatechange = function(){
            if(this.readyState === 4 && this.status === 200){
                document.all.booking_count.value=this.responseText;
            }
        }   
    }

    // 原始身分證驗證邏輯
    function check_id(id){
        if (id.length != 10) return(false);
        if (isNaN(id.substr(1,9)) || (id.substr(0,1)<"A" ||id.substr(0,1)>"Z")) return(false);
        var head="ABCDEFGHJKLMNPQRSTUVXYWZIO";
        id = (head.indexOf(id.substring(0,1))+10) +''+ id.substr(1,9)
        s =parseInt(id.substr(0,1)) + parseInt(id.substr(1,1)) * 9 + parseInt(id.substr(2,1)) * 8 + parseInt(id.substr(3,1)) * 7 + parseInt(id.substr(4,1)) * 6 + parseInt(id.substr(5,1)) * 5 + parseInt(id.substr(6,1)) * 4 + parseInt(id.substr(7,1)) * 3 + parseInt(id.substr(8,1)) * 2 + parseInt(id.substr(9,1)) + parseInt(id.substr(10,1));
        return ((s % 10) == 0);
    }

    function validateMobile(sMobile) {
      var reMobile = /((?=(09))[0-9]{10})$/g;
      if(!sMobile.match(reMobile)) { alert("手機號碼格式有誤!"); return false; }
      return true;
    }

    function validateDate(y, m, d) {
        var newyear = y + 1911;
        var date = new Date(newyear, m - 1, d);
        return (date.getFullYear() == newyear && (date.getMonth()+1) == m && date.getDate() == d);
    }

    function Submit() {
        var mname = document.getElementById('member_name').value;
        if (mname == '') { alert('請輸入姓名資料！'); return false; }
        var bid = document.getElementById('member_birthday').value.trim();
        if (bid == '' || (bid.length != 7 && bid.length != 6)) { alert('請輸入民國年出生日期！'); return false; }
        var pid = document.getElementById('member_pid').value.trim();
        if (!check_id(pid)) { alert('身分證資料有誤！'); return false; }
        if (!validateMobile(document.getElementById('member_phone').value.trim())) return false;
        if (document.getElementById("reserve_date").value == "0") { alert("請選擇預約日期"); return false; }
        
        var val = document.getElementById('val2').value.toLowerCase();
        if(val != document.getElementById('ans').value){ alert('驗證碼錯誤！'); return false; }
        
        document.all.idtypeValue.value = idtypeValue;
        document.all.breakfastValue.value = breakfastValue;
        document.all.act2.value = "Add";
        document.frm2.submit();
    }

    // 驗證碼繪圖
    function draw(show_num) {
        var canvas = document.getElementById("canvas");
        var context = canvas.getContext("2d");
        canvas.width = 100; canvas.height = 35;
        var sCode = "A,B,C,E,F,G,H,J,K,L,M,N,P,Q,R,S,T,W,X,Y,Z,1,2,3,4,5,6,7,8,9,0";
        var aCode = sCode.split(",");
        for (var i = 0; i < 4; i++) {
            var txt = aCode[Math.floor(Math.random() * aCode.length)];
            show_num[i] = txt.toLowerCase();
            context.font = "bold 23px Arial";
            context.fillStyle = "blue";
            context.fillText(txt, 10 + i*20, 25);
        }
        document.getElementById("ans").value = show_num.join("");
    }

    $(function(){
        var show_num = [];
        draw(show_num);
        $("#canvas2").click(function(){ draw(show_num); });
        
        // 初始化日期選單
        var list = document.getElementById("reserve_date");
        var start = new Date("2026-04-01");
        var end = new Date("2026-12-12");
        for(var d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
            if(d.getDay() != 0) {
                var v = d.toISOString().split('T')[0];
                list.add(new Option(v, v));
            }
        }
    });
  </script>

  <div class="floating-mic-container">
    <div class="ai-bubble" id="aiBubble">您好！點我可以用語音幫您填表喔</div>
    <button class="mic-btn" id="micBtn">🎤</button>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const aiBubble = document.getElementById('aiBubble');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';

        micBtn.addEventListener('click', () => {
            recognition.start();
            micBtn.classList.add('listening');
            aiBubble.innerHTML = "正在聆聽...";
            aiBubble.style.display = 'block';
        });

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            micBtn.classList.remove('listening');
            aiBubble.innerHTML = '<div class="loading-spinner"></div> AI 正在填寫...';
            
            fetch('http://127.0.0.1:8000/api/ai_autofill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    const data = result.data;
                    if(data.name) document.getElementById('member_name').value = data.name;
                    if(data.pid) document.getElementById('member_pid').value = data.pid;
                    if(data.phone) document.getElementById('member_phone').value = data.phone;
                    aiBubble.innerText = "✅ 填寫完成！";
                    setTimeout(() => { aiBubble.style.display = 'none'; }, 3000);
                }
            })
            .catch(() => { aiBubble.innerText = "❌ 解析失敗"; });
        };
    }
  </script>
