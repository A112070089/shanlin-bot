<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>診所管理中心｜DOUBTS</title><link rel="stylesheet" href="/platform/assets/platform.css"><link rel="stylesheet" href="/platform/assets/clinic-center.css"></head><body><header><div><strong>頤典 DOUBTS</strong><span>工程師平台 · 診所管理中心（本機草稿）</span></div><a class="back-link" href="/platform/admin">← 返回工程師總控台</a></header><main><h1>診所管理中心</h1><p class="muted">管理既有診所及未來新診所的導入草稿。本功能不建立正式帳號、Firebase 或預約資料；診所身分與正式系統仍然隔離。</p><p id="status" role="status">驗證工程師身分中…</p><section id="content" hidden><h2>已連接的診所</h2><div id="existing" class="cards"></div><h2>新增診所草稿</h2><form id="createForm" class="card"><div class="form-grid"><label>診所識別碼（英文小寫）<input id="clinicId" type="text" required minlength="3" maxlength="32" pattern="[a-z][a-z0-9-]{2,31}" placeholder="例如: demo-clinic" autocomplete="off"></label><label>診所顯示名稱<input id="displayName" type="text" required minlength="2" maxlength="80" placeholder="例如: 示範診所"></label></div><label>內部導入備註（請勿輸入病患個資）<textarea id="notes" maxlength="240" rows="2" placeholder="例如：待核對管理帳號、聯絡資料與預約流程"></textarea></label><div class="actions"><button id="createBtn" type="submit">建立導入草稿</button></div></form><h2>導入草稿清單</h2><div id="drafts" class="cards"></div><h2>最近變更紀錄</h2><div id="clinicAudit" class="card">讀取中…</div></section><section id="editor" class="card editor" hidden><h2>編輯診所草稿 <span id="editingClinic"></span></h2><form id="editForm"><label>診所名稱<input id="editName" required minlength="2" maxlength="80"></label><label>備註（禁止病患個資）<textarea id="editNotes" rows="3" maxlength="240"></textarea></label><label class="checkbox-line"><input type="checkbox" id="archived">封存草稿（僅影響此草稿，不影響現有診所）</label><div class="actions"><button id="editSaveBtn" type="submit">儲存草稿</button><button id="editCancelBtn" type="button" class="outline">取消</button></div></form></section><p class="muted bottom-note">正式啟用一間診所仍需要：獨立的驗證帳號、資料庫路徑、預約權限與驗收。建立草稿不會自動完成這些操作。</p></main><script src="/platform/assets/clinic-center.js" defer></script></body></html>
